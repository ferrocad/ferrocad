[alias]
# `cargo xtask <task>` -> the `xtask` crate (crates/xtask).
xtask = "run --package xtask --"

[target.'cfg(target_os = "linux")']
# Development-only runtime lookup for the OCCT shared libraries. `target/debug`
# and `target/debug/deps` sit at different depths, so both relative forms are
# present; `$ORIGIN` is expanded by the dynamic loader, not the shell. Packaged
# editions set their own library path.
#
# Scoped to Linux rather than `[build]`: these are ELF link arguments, and
# `rust-lld` rejects `-Wl,-rpath` for wasm, which would break every
# `--target wasm32-unknown-unknown` build that does not set RUSTFLAGS (the cross
# image sets its own, which is why `ferrocad_web`'s container build never saw
# this).
rustflags = [
    "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../.occt/prefix/lib",
    "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../.occt/prefix/lib",
]

# RustPython's `getrandom` refuses `wasm32-unknown-unknown` unless the backend is
# named. `wasm_js` is the browser's `crypto.getRandomValues`, enabled by
# `rustpython-vm`'s `wasmbind` feature; the cfg is the other half getrandom asks for.
# Nothing else in the wasm graph uses getrandom, so this is inert for the browser
# host and the OCCT bridge. The cross image supplies its wasi-sdk link paths through
# `CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS`, the same config key cargo joins
# this matching `target.cfg(...)` entry with, so that flag survives. A plain
# `RUSTFLAGS` in the environment would replace both — CI deliberately sets none.
[target.'cfg(target_arch = "wasm32")']
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[env]
# The local OCCT prefix fetched by CI (and by the recipe in
# docs/developer/architecture/occt-bundling.md) lives at `.occt/prefix`. `relative = true`
# resolves these paths against the workspace root, so they work from any working
# directory. A value already set in the environment wins, which keeps a system
# OCCT or a custom prefix easy to use.
OpenCASCADE_DIR = { value = ".occt/prefix/lib/cmake/opencascade", relative = true }
OCCT_INCLUDE_DIR = { value = ".occt/prefix/include/opencascade", relative = true }
# Only needed when `builtin` is enabled: the vendored 7.8.1 submodule predates
# CMake's 3.10 floor. The shared 8.0.1 probe requires 3.15.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# Runtime library path for `cargo run`/`cargo test` (OCCT ships no RUNPATH).
LD_LIBRARY_PATH = { value = ".occt/prefix/lib", relative = true }
