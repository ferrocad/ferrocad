name: CI

on:
  push:
  pull_request:

jobs:
  # Headless tests: the primary validation path. bite-gpui's #[gpui::test]
  # harness and the PyO3 tests run without a display server or GPU.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CPython headers (PyO3 embedding / extension build)
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: fc-core (pure Rust) tests
        working-directory: rust/fc-core
        run: cargo test

      - name: fc-host headless tests (bite-gpui + embedded CPython)
        working-directory: rust/fc-host
        run: cargo test

      - name: freecad-core (C ABI) build
        working-directory: rust/freecad-core
        run: cargo build

      - name: freecad-py (PyO3 extension) build
        working-directory: rust/freecad-py
        run: cargo build

  # Real-window smoke test: opens a bite-gpui window under Xvfb using the
  # lavapipe software Vulkan driver. This exercises the non-headless path that
  # the sandbox cannot (no display server). A crash fails the job.
  real-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Xvfb + software Vulkan (lavapipe) + CPython headers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers python3-dev
      - name: Open a real window (must not crash within 30s)
        working-directory: rust/fc-host
        run: |
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          timeout 30 xvfb-run -a cargo run
