name: CI

on:
  push:
  pull_request:

jobs:
  # Preflight: the two cheapest gates, deliberately first. `cargo xtask editions`
  # reads `cargo metadata` only (no compiler, no OCCT, ~30 ms) and
  # `tools/run_tests.py --check` only reads `contracts/extension-sets.json` (no
  # imports, no build, ~0.06 s). Both fail in seconds -- on a kernel crate leaking
  # into `ferrocad`/`ferrocad_toy`/the UI crates (`contracts/editions.json`) or on
  # a stale extension-set contract -- before any job spends minutes compiling. The
  # runner image already has `cargo` and `python3`; this job installs no desktop
  # dependencies and builds no extension.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edition dependency rules (contracts/editions.json)
        run: cargo xtask editions --check

      - name: Extension-set contract (contracts/extension-sets.json)
        # Every `tests/test_*.py` must be listed exactly once; an unlisted or
        # deleted module is a reviewed-diff error, not a silent skip.
        run: python3 tools/run_tests.py --check

  # Headless tests: the primary validation path. ferrocad_core's unit tests and
  # the PyO3 tests run without a display server or GPU.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pin the interpreter: `tools/api_docs.py` reads signatures from the live
      # modules, and CPython point releases report inherited builtins differently
      # (the generator now ignores those, but pinning keeps the whole facade and
      # the doc build reproducible). Keep this in step with docs/project/documentation.md.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPython headers + GPUI system libraries (PyO3, X11/xkb/fontconfig)
        uses: ./.github/actions/linux-desktop-deps
        with:
          extra: python3-dev

      - name: ferrocad_core (pure Rust) tests
        working-directory: crates/ferrocad_core
        run: cargo test

      - name: xtask unit tests (bundler closure + PE import walker)
        # `xtask` is a build tool outside `default-members`, so the root
        # `cargo test` would skip it. It is dependency-free and fast.
        run: cargo test -p xtask

      - name: Build the FreeCAD extension module (for the shell tests)
        # The shell tests import the FreeCAD facade, which imports the `ferrocad`
        # extension. Locally `build.sh` leaves the `.so` in `python/`; CI must
        # build it too (the shell library does not link the bindings itself).
        run: |
          cargo build -p ferrocad_py --features extension-module
          cp target/debug/libferrocad_py.so python/ferrocad.abi3.so

      - name: Python facade, bindings and MVP workflow tests (the `base` extension set)
        # This job builds only the primary extension, so it provides no workbench
        # module. `--extension base` is explicit: an omitted flag must not read as
        # "everything provided". The workbench suites run in `geometry`.
        run: |
          PYTHONPATH=python python3 tests/test_fc_core.py
          PYTHONPATH=python python3 tools/run_tests.py --extension base
          PYTHONPATH=python python3 examples/mvp_workflow.py

      - name: Generated documentation is current
        # The user guides are rendered by running real workflows, the API
        # reference is read from the live modules, and the concept images are
        # generated assets (SVGs plus manifest-pinned viewport snapshots). So this
        # is a behaviour check as well as a documentation one. See
        # docs/project/documentation.md.
        run: |
          python3 tools/userdocs.py --check
          python3 tools/api_docs.py --check
          python3 tools/generate_concept_diagrams.py --check
          python3 tools/generate_general_figures.py --check
          python3 tools/build_book.py --check
          PYTHONPATH=python python3 tools/test_docs_tooling.py
          PYTHONPATH=python python3 tools/test_screenshot.py

      - name: ferrocad_gpui headless tests (bite-gpui + embedded CPython)
        working-directory: crates/ferrocad_gpui
        run: cargo test

      - name: ferrocad_toy end-to-end test (the generic interaction registry, no kernel)
        working-directory: crates/ferrocad_toy
        run: cargo test

      - name: ferrocad_py + ferrocad_gen (primary + generated bindings) build
        working-directory: crates/ferrocad_py
        run: cargo build

  # Windows: the headless tests on the platform where the app manifest matters.
  # A GPUI/winit binary needs Version 6 of comctl32.dll, which only arrives if the
  # manifest is embedded in the linked executable -- including the per-target
  # harness binaries `cargo test` links. A harness without it aborts at startup
  # with 0xc0000139 before any test runs, so this is the only job that exercises
  # that path. See docs/developer/architecture/distribution.md section 6.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the D3D12 windows-crate pin
        # `gpu-allocator` (wgpu-hal's DX12 allocator) and wgpu-hal must build
        # against the same `windows` crate. `gpu-allocator 0.28` accepts
        # 0.53–0.62 while `sysinfo` caps at 0.57, so Cargo.lock pins
        # gpu-allocator to 0.62.2. See Cargo.toml [workspace.metadata].
        shell: python
        run: |
          import sys
          lock = open("Cargo.lock", encoding="utf-8").read()
          block = lock.split('name = "gpu-allocator"', 1)[1].split("[[package]]", 1)[0]
          if '"windows 0.62.2"' not in block:
              sys.exit(
                  "Cargo.lock must pin gpu-allocator to windows 0.62.2; "
                  "see Cargo.toml [workspace.metadata.gpu-allocator]"
              )

      - name: Build the FreeCAD extension module (for the shell tests)
        # The shell tests import the FreeCAD facade, which imports the `ferrocad`
        # extension. On Windows the extension is a `.pyd`, not an `.abi3.so`.
        run: |
          cargo build -p ferrocad_py --features extension-module
          Copy-Item target\debug\ferrocad_py.dll python\ferrocad.pyd

      - name: ferrocad_widgets + ferrocad_gpui + ferrocad_toy headless tests
        run: cargo test -p ferrocad_widgets -p ferrocad_gpui -p ferrocad_toy

  # Real-window smoke test: opens a bite-gpui window under Xvfb using the
  # lavapipe software Vulkan driver. This exercises the non-headless path that
  # the sandbox cannot (no display server). A crash fails the job.
  #
  # It runs the `ferrocad_parametric` edition (base app + the OCCT-backed Part
  # workbench), so it also proves the Part module loads: `import Part` needs OCCT
  # present at runtime, and the app boots the interpreter that imports it.
  real-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Xvfb + software Vulkan (lavapipe) + CPython headers + GPUI libs
        uses: ./.github/actions/linux-desktop-deps
        with:
          extra: xvfb mesa-vulkan-drivers python3-dev
      - name: Fetch OCCT 8.0.1 novtk (conda-forge, rootless) for the Part workbench
        run: |
          mkdir -p .occt
          curl -sSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C .occt
          export MAMBA_ROOT_PREFIX="$PWD/.occt/root"
          .occt/bin/micromamba create -y -p "$PWD/.occt/prefix" -c conda-forge occt=8.0.1=novtk_*
      - name: Build and validate the docs screenshot tool
        run: |
          cargo build -p ferrocad_snapshot
          cat > /tmp/snapshot-spec.json <<'EOF'
          {"size":[96,64],"camera":{"eye":[-120,-160,120],"target":[10,10,10]},"shapes":[{"geometry":{"box":{"size":[20,10,6]}}}]}
          EOF
          ./target/debug/ferrocad_snapshot --validate /tmp/snapshot-spec.json

      - name: Open a real window with the Part workbench (must not crash within 30s)
        run: |
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          # Only needed when `builtin` is enabled: the vendored 7.8.1 submodule
          # predates CMake's 3.10 floor. The shared 8.0.1 probe requires 3.15.
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export OpenCASCADE_DIR="$PWD/.occt/prefix/lib/cmake/opencascade"
          export OCCT_INCLUDE_DIR="$PWD/.occt/prefix/include/opencascade"
          export LD_LIBRARY_PATH="$PWD/.occt/prefix/lib:$LD_LIBRARY_PATH"
          # Build first: the 30s budget is for the run, not a cold compile.
          cargo build -p ferrocad -p ferrocad_parametric
          # `timeout` exits 124 after killing a process that was still alive at
          # 30s, which is the pass condition (no crash). Any other exit is a
          # crash (or a boot failure) and fails the job.
          code=0
          timeout 30 xvfb-run -a ./target/debug/ferrocad_parametric || code=$?
          if [ "$code" != "124" ]; then exit "$code"; fi

  # Geometry: the OCCT backend (`ferrocad_occt`) and the Part bindings that sit on
  # it (`ferrocad_part`, `ferrocad_part_py`). They need a kernel, so OCCT 8.0.1 is
  # fetched from conda-forge into a local prefix (rootless) and built against it.
  # This is the only job that needs OCCT; the fast jobs above do not, because these
  # crates are not in `default-members`.
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CPython headers + GPUI system libraries (the edition links GPUI)
        uses: ./.github/actions/linux-desktop-deps
        with:
          extra: python3-dev
      - name: Fetch OCCT 8.0.1 novtk (conda-forge, rootless)
        run: |
          mkdir -p .occt
          curl -sSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C .occt
          export MAMBA_ROOT_PREFIX="$PWD/.occt/root"
          .occt/bin/micromamba create -y -p "$PWD/.occt/prefix" -c conda-forge occt=8.0.1=novtk_*
      - name: Build and test the OCCT-backed crates
        run: |
          # Only needed when `builtin` is enabled: the vendored 7.8.1 submodule
          # predates CMake's 3.10 floor. The shared 8.0.1 probe requires 3.15.
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export OpenCASCADE_DIR="$PWD/.occt/prefix/lib/cmake/opencascade"
          export OCCT_INCLUDE_DIR="$PWD/.occt/prefix/include/opencascade"
          export LD_LIBRARY_PATH="$PWD/.occt/prefix/lib:$LD_LIBRARY_PATH"
          cargo test -p ferrocad_occt -p ferrocad_part -p ferrocad_part_py -p ferrocad_parametric

      - name: Build the combined Python extension module and import it from a host interpreter
        # `ferrocad_combined.abi3.so` is the one extension that links App + Part +
        # Mesh, so a plain host CPython can `import Part`/`import Mesh` and they
        # share one document registry. This is the packaged-module gate the
        # in-process harness cannot express; see
        # docs/developer/workbenches/part-api-audit.md and crates/ferrocad_combined_py.
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          export OpenCASCADE_DIR="$PWD/.occt/prefix/lib/cmake/opencascade"
          export OCCT_INCLUDE_DIR="$PWD/.occt/prefix/include/opencascade"
          export LD_LIBRARY_PATH="$PWD/.occt/prefix/lib:$LD_LIBRARY_PATH"
          cargo build -p ferrocad_combined_py --features ferrocad_combined_py/extension-module
          cp target/debug/libferrocad_combined_py.so python/ferrocad_combined.abi3.so
          PYTHONPATH=python python3 tests/test_packaged_modules.py -v

      - name: Kernel Python suites (the workbench modules this build provides)
        # The kernel suites (`tests/test_part`, `test_packaged_modules`,
        # `test_gui_snapping`, `test_flatmesh_part`, 31 tests) need the one extension
        # that links App + Part + Mesh, so they were skipped in every job before the
        # extension-set split. This step names the workbench modules this build
        # provides against the artifact the previous step copied to
        # `python/ferrocad_combined.abi3.so`; naming them rather than using the
        # `workbenches` preset means a newly added workbench module cannot be
        # silently covered. The full `LD_LIBRARY_PATH` is required because
        # importing Part loads OCCT.
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          export OpenCASCADE_DIR="$PWD/.occt/prefix/lib/cmake/opencascade"
          export OCCT_INCLUDE_DIR="$PWD/.occt/prefix/include/opencascade"
          export LD_LIBRARY_PATH="$PWD/.occt/prefix/lib:$LD_LIBRARY_PATH"
          PYTHONPATH=python python3 tools/run_tests.py \
            --extension Part --extension Mesh --extension MeshPart

      - name: Boot the edition and check its built-in kernel extensions
        # K1: the previous step leaves `python/ferrocad_combined.abi3.so` on disk,
        # so the edition boots with the on-disk extension present. It must still
        # use its own built-ins (one kernel for App + Part + Mesh + MeshPart) and
        # `import ferrocad_combined` must refuse to replace them. `--check-init`
        # asserts the kernel identity and exercises a Part::Feature document (K0).
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          export OpenCASCADE_DIR="$PWD/.occt/prefix/lib/cmake/opencascade"
          export OCCT_INCLUDE_DIR="$PWD/.occt/prefix/include/opencascade"
          export LD_LIBRARY_PATH="$PWD/.occt/prefix/lib:$LD_LIBRARY_PATH"
          export PYTHONPATH="$PWD/python:$PYTHONPATH"
          cargo build -p ferrocad_parametric
          target/debug/ferrocad_parametric --check-init

      - name: SimpleCAD S0 static audit (optional; needs a sibling checkout)
        # S0 is measurement only. PR CI does not clone SimpleCAD, so this is a
        # no-op there; a developer image or a future scheduled job that checks
        # out the pinned revision gets the drift alarm. See
        # docs/project/research/simplecad-bringup.md §7 (S0).
        run: |
          if [ -d ../simplecad ]; then
            python3 tools/simplecad_audit.py --check
          else
            echo "SimpleCAD checkout not present; skipping S0 audit"
          fi

      - name: Part/OCCT API audit (optional; needs a sibling checkout)
        # Measurement only: compares crates/ferrocad_part_py with upstream's
        # Part/App surface. PR CI does not clone freecad-upstream, so this is a
        # no-op there; a developer image gets the drift alarm. See
        # docs/developer/workbenches/part-api-audit.md.
        run: |
          if [ -d ../freecad-upstream ]; then
            python3 tools/part_api_audit.py --check
          else
            echo "freecad-upstream checkout not present; skipping Part API audit"
          fi

  # WASM. The model side is kernel-free (`wasm-example`); the OCCT-backed Part
  # layer compiles and links against a prebuilt wasm kernel. The tarball is
  # cadrum's OCCT 8.0.1 build, and the image supplies the wasi-sdk toolchain
  # whose rebuilt sysroot matches its wasm-EH encoding. The tarball is headless
  # (no IGES, STL, BRepFeat or OCAF toolkits): unused bindings are dropped by
  # --gc-sections, so a normal geometry path links, but calling those does not.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Pinned by digest: the toolchain's wasm-EH encoding must match the OCCT
      # tarball, so an image update is a deliberate change.
      image: ghcr.io/lzpel/cross-wasm32-unknown-unknown@sha256:4dc88df287da141e67588ba80ebf1d14d5cb24f5b05302c57b11b2a1e9bed1df
    steps:
      - uses: actions/checkout@v4
      - name: Build the kernel-free model to wasm32
        run: cargo build -p wasm-example --release --target wasm32-unknown-unknown
      - name: Fetch the prebuilt wasm OCCT 8.0.1
        env:
          OCCT_WASM_URL: https://github.com/lzpel/cadrum/releases/download/occt-8_0_1_rev3/occt-8_0_1_rev3-wasm32_unknown_unknown.tar.gz
        run: |
          curl -sSL -o /tmp/occt-wasm.tar.gz "$OCCT_WASM_URL"
          mkdir -p "$GITHUB_WORKSPACE/.occt-wasm"
          tar xzf /tmp/occt-wasm.tar.gz -C "$GITHUB_WORKSPACE/.occt-wasm"
      - name: Check the bridge and the Part layer for wasm32
        env:
          OCCT_WASM_ROOT: ${{ github.workspace }}/.occt-wasm/occt-8_0_1_rev3-wasm32_unknown_unknown
        run: |
          cargo check -p ferrocad_occt_cxx --target wasm32-unknown-unknown --locked
          cargo check -p ferrocad_occt --target wasm32-unknown-unknown --locked
      - name: Link the wasm cdylib (box, fillet, tessellate)
        env:
          OCCT_WASM_ROOT: ${{ github.workspace }}/.occt-wasm/occt-8_0_1_rev3-wasm32_unknown_unknown
        run: cargo build -p ferrocad_occt_wasm --target wasm32-unknown-unknown --locked

  # The browser host: build `ferrocad_web` (OCCT + wgpu, WebGL2 fallback) in the
  # cross image, then run wasm-bindgen and the Node smoke test on the runner.
  # `wasm-bindgen` is not in the image, and its CLI version must equal the crate's
  # schema version, so derive it from the lock instead of hard-coding it.
  wasm-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the wasm-bindgen version from the lock
        id: bindgen
        run: |
          version=$(cargo tree -p wasm-bindgen --depth 0 | awk 'NR==1 {print $2}' | tr -d v)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $version"
      - name: Fetch the prebuilt wasm OCCT 8.0.1
        run: |
          curl -sSL -o /tmp/occt-wasm.tar.gz https://github.com/lzpel/cadrum/releases/download/occt-8_0_1_rev3/occt-8_0_1_rev3-wasm32_unknown_unknown.tar.gz
          mkdir -p .occt-wasm
          tar xzf /tmp/occt-wasm.tar.gz -C .occt-wasm
      - name: Build ferrocad_web in the cross image
        run: |
          mkdir -p target
          docker run --name web \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e OCCT_WASM_ROOT=/work/.occt-wasm/occt-8_0_1_rev3-wasm32_unknown_unknown \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e HTTP_PROXY -e HTTPS_PROXY -e ALL_PROXY \
            ghcr.io/lzpel/cross-wasm32-unknown-unknown@sha256:4dc88df287da141e67588ba80ebf1d14d5cb24f5b05302c57b11b2a1e9bed1df \
            cargo build --release -j 2 -p ferrocad_web --target wasm32-unknown-unknown --locked
          docker cp web:/tmp/target/wasm32-unknown-unknown/release/ferrocad_web.wasm target/wasm-web.wasm
          docker rm web
      - name: Install the matching wasm-bindgen CLI
        env:
          VERSION: ${{ steps.bindgen.outputs.version }}
        run: |
          base="wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl"
          curl -sSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/${base}.tar.gz"
          curl -sSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/${base}.tar.gz.sha256sum"
          sed 's#gh-release/##' "${base}.tar.gz.sha256sum" | sha256sum -c -
          tar xzf "${base}.tar.gz"
          install -m 755 "${base}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          test "$(wasm-bindgen --version | awk '{print $2}')" = "$VERSION"
      - name: Generate the JS glue and run the Node smoke test
        run: |
          wasm-bindgen --target web --out-dir crates/ferrocad_web/www/pkg target/wasm-web.wasm
          node crates/ferrocad_web/www/smoke.mjs
