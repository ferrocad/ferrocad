name: Crates

# Publish the library crates to crates.io on a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN (a crates.io API token).
# Crates whose version is already on crates.io are skipped, so re-running a tag is
# safe. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Tests
        run: cargo test

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu

          # Dependency order: core, then widgets, then gpui (which depends on
          # widgets). Others set `publish = false`.
          crates="ferrocad_core ferrocad_widgets ferrocad_gpui"

          on_crates_io() {
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: ferrocad-release' \
              "https://crates.io/api/v1/crates/$1/$2")
            [ "$code" = "200" ]
          }

          for name in $crates; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(p["version"] for p in d["packages"] if p["name"]==sys.argv[1]))' "$name")

            if on_crates_io "$name" "$version"; then
              echo "$name $version is already on crates.io; skipping"
              continue
            fi

            echo "== publishing $name $version =="
            cargo publish -p "$name"

            # Wait until the version is visible so the next (dependent) crate can
            # resolve it from the index.
            for _ in $(seq 1 30); do
              on_crates_io "$name" "$version" && break
              sleep 5
            done
          done
