name: Crates

# Publish the library crates to crates.io on a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN (a crates.io API token).
# Crates whose version is already on crates.io are skipped, so re-running a tag is
# safe. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GPUI system libraries
        # `cargo publish` verify-builds each crate in isolation; the GPUI stack
        # needs fontconfig, xcb and xkbcommon dev packages to build and link.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libfontconfig1-dev pkg-config
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify the tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Tests
        run: cargo test

      - name: Fetch workbench scripts
        # The published `ferrocad` crate embeds the workbenches, so `cargo
        # install ferrocad` yields an app that can load one. Swap `stage-payload
        # --python-only` in below to ship a smaller, workbench-less crate.
        run: cargo xtask mods

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu

          # Dependency order: core, py (bindings), widgets, gpui, then the base
          # app (links py + gpui). Others set `publish = false`.
          crates="ferrocad_core ferrocad_py ferrocad_widgets ferrocad_gpui ferrocad"

          on_crates_io() {
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: ferrocad-release' \
              "https://crates.io/api/v1/crates/$1/$2")
            [ "$code" = "200" ]
          }

          # The app crate carries the Python payload (`python/` and `mods/`) in
          # its tarball. Those live at the workspace root, so they are staged
          # beside the crate for the publish and removed again afterwards, even
          # if the job fails.
          cleanup_payload() { cargo xtask unstage-payload; }
          trap cleanup_payload EXIT INT TERM

          for name in $crates; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(p["version"] for p in d["packages"] if p["name"]==sys.argv[1]))' "$name")

            if on_crates_io "$name" "$version"; then
              echo "$name $version is already on crates.io; skipping"
              continue
            fi

            if [ "$name" = "ferrocad" ]; then
              cargo xtask stage-payload
            fi

            # `ferrocad` carries the payload staged above; those files are
            # untracked on purpose, so the tree is dirty. Allow that for this
            # crate only (everything else must be committed).
            publish_args=""
            if [ "$name" = "ferrocad" ]; then
              publish_args="--allow-dirty"
            fi

            echo "== publishing $name $version =="
            cargo publish -p "$name" $publish_args

            # Wait until the version is visible so the next (dependent) crate can
            # resolve it from the index.
            for _ in $(seq 1 30); do
              on_crates_io "$name" "$version" && break
              sleep 5
            done
          done
