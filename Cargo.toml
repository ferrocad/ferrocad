# FerroCAD — rust workspace.
#
# The project was formerly "freecad-rs-poc"; this workspace is the beginning of
# the deliverable layout. It is meant to grow into a standalone, drop-in
# replacement for FreeCAD's C++ App core: `ferrocad_core` is the pure model,
# `ferrocad_py` the PyO3 extension behind the `FreeCAD` Python namespace.
[workspace]
resolver = "3"
members = [
    "crates/ferrocad",
    "crates/ferrocad_types",
    "crates/ferrocad_theme",
    "crates/ferrocad_curves",
    "crates/ferrocad_core",
    "crates/ferrocad_lineage",
    "crates/ferrocad_geom",
    "crates/ferrocad_mesh",
    "crates/ferrocad_mesh_py",
    "crates/ferrocad_combined_py",
    "crates/ferrocad_occt",
    "crates/ferrocad_part",
    "crates/ferrocad_part_gui",
    "crates/ferrocad_part_py",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
    "crates/ferrocad_inventor",
    "crates/ferrocad_graphics",
    "crates/ferrocad_stage",
    "crates/ferrocad_wgpu",
    "crates/ferrocad_inventor_py",
    "crates/ferrocad_stage_py",
    "crates/ferrocad_ui",
    "crates/ferrocad_ui_py",
    "crates/ferrocad_viewport",
    "crates/ferrocad_widgets",
    "crates/ferrocad_gpui",
    "crates/ferrocad_parametric",
    "crates/ferrocad_toy",
    "crates/xtask",
]
# The GUI crates (`ferrocad_viewport`, `ferrocad_widgets`, `ferrocad_gpui`,
# `ferrocad`), the renderer (`ferrocad_wgpu`, which pulls in the whole GPU stack) and
# the pivy facade (`ferrocad_inventor_py`, which needs CPython headers), plus the
# OCCT-backed editions (`ferrocad_parametric`, via `ferrocad_part_py`), are workspace
# members so `-p <crate>` works, but they are excluded from `default-members` because
# building them is slow. The pure `ferrocad_graphics`, scene core `ferrocad_inventor`,
# `ferrocad_stage`, `ferrocad_mesh` (pure data: no kernel, no OCCT, no Python) and
# `ferrocad_part_gui` (presentation only: no kernel, no GPU, no CPython) stay in
# `default-members`.
# `ferrocad_gpui` embeds CPython via PyO3 `auto-initialize`; it links fine in a
# full `cargo build --workspace` because the extension crates keep
# `pyo3/extension-module` opt-in (see their manifests), avoiding the libpython
# link conflict.
default-members = [
    "crates/ferrocad_types",
    "crates/ferrocad_theme",
    "crates/ferrocad_curves",
    "crates/ferrocad_core",
    "crates/ferrocad_geom",
    "crates/ferrocad_mesh",
    "crates/ferrocad_graphics",
    "crates/ferrocad_inventor",
    "crates/ferrocad_stage",
    "crates/ferrocad_part_gui",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "LGPL-2.1-or-later"
readme = "README.md"
repository = "https://github.com/ferrocad/ferrocad"
homepage = "https://github.com/ferrocad/ferrocad"
rust-version = "1.85"

[workspace.dependencies]
include_dir = "0.7"
petgraph = "0.6"
# Q2a's `ferrocad_ui_py` consumes the workspace PyO3 pin; other extension
# crates still declare their own version/features. `abi3-py311` matches the
# FreeCAD 1.0 baseline.
pyo3 = { version = "0.25", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-segmentation = "1"
# Internal crates carry both a `path` (for development) and a `version` (which
# crates.io requires). Publish them in dependency order: `ferrocad_types`,
# `ferrocad_theme`, `ferrocad_graphics`, `ferrocad_core`, `ferrocad_geom`, `ferrocad_mesh`,
# `ferrocad_occt`, `ferrocad_part`, `ferrocad_py`, `ferrocad_mesh_py`, `ferrocad_part_py`,
# `ferrocad_stage`,
# `ferrocad_part_gui`, `ferrocad_stage_py`, `ferrocad_viewport`, `ferrocad_widgets`,
# `ferrocad_gpui` and finally the `ferrocad` app. See ../docs/architecture/releasing.md.
#
# Versions are per crate, not workspace-wide: a release may bump only the crates
# whose sources changed, so the publish workflow skips the rest (their version is
# already on crates.io). This release bumps all of them to 0.1.4 in lockstep.
# `[workspace.package] version` is the release/product version, which the release
# workflow checks the git tag against.
ferrocad_types = { path = "crates/ferrocad_types", version = "0.1.4" }
ferrocad_theme = { path = "crates/ferrocad_theme", version = "0.1.4" }
ferrocad_curves = { path = "crates/ferrocad_curves", version = "0.1.4" }
ferrocad_lineage = { path = "crates/ferrocad_lineage", version = "0.1.4" }
ferrocad_core = { path = "crates/ferrocad_core", version = "0.1.4" }
ferrocad_geom = { path = "crates/ferrocad_geom", version = "0.1.4" }
ferrocad_mesh = { path = "crates/ferrocad_mesh", version = "0.1.4" }
ferrocad_mesh_py = { path = "crates/ferrocad_mesh_py", version = "0.1.4" }
ferrocad_combined_py = { path = "crates/ferrocad_combined_py", version = "0.1.4" }
ferrocad_occt = { path = "crates/ferrocad_occt", version = "0.1.4" }
ferrocad_part = { path = "crates/ferrocad_part", version = "0.1.4" }
ferrocad_part_py = { path = "crates/ferrocad_part_py", version = "0.1.4" }
ferrocad_py = { path = "crates/ferrocad_py", version = "0.1.4" }
ferrocad_graphics = { path = "crates/ferrocad_graphics", version = "0.1.4" }
ferrocad_inventor = { path = "crates/ferrocad_inventor", version = "0.1.4" }
ferrocad_stage = { path = "crates/ferrocad_stage", version = "0.1.4" }
ferrocad_part_gui = { path = "crates/ferrocad_part_gui", version = "0.1.4" }
ferrocad_wgpu = { path = "crates/ferrocad_wgpu", version = "0.1.4" }
ferrocad_viewport = { path = "crates/ferrocad_viewport", version = "0.1.4" }
ferrocad_inventor_py = { path = "crates/ferrocad_inventor_py", version = "0.1.4" }
ferrocad_stage_py = { path = "crates/ferrocad_stage_py", version = "0.1.4" }
ferrocad_ui = { path = "crates/ferrocad_ui", version = "0.1.4" }
ferrocad_widgets = { path = "crates/ferrocad_widgets", version = "0.1.4" }
ferrocad_gpui = { path = "crates/ferrocad_gpui", version = "0.1.4" }
ferrocad = { path = "crates/ferrocad", version = "0.1.4" }

# Cargo cannot express "gpu-allocator must use the same `windows` crate as
# wgpu-hal". `gpu-allocator 0.28` accepts 0.53–0.62 while `sysinfo` caps at 0.57,
# so `Cargo.lock` pins gpu-allocator to `windows 0.62.2` (the version wgpu-hal
# uses). Mixing 0.57 with 0.62 breaks the DX12 API boundary on Windows
# (`ResourceCategory`, `ID3D12Heap`), which is how the Windows job failed on
# 2026-10-25. After `cargo update`, re-check that pin.
[workspace.metadata.gpu-allocator]
windows = "0.62.2"

# `lto` pays off for the extension/shared libraries; keep it workspace-wide.
[profile.release]
opt-level = 3
lto = true

# Temporary patch: bite-gp-apple 1.24.402/1.25.202 import `cocoa` without
# declaring it. See third_party/bite-gp-apple/PATCHES.md.
#
# opencascade-sys 0.3.0 allocates `opencascade::handle<T>` where its
# `unique_ptr<Handle_T>` requires `Handle_T`; that is fine on GCC/Clang (typedef)
# but not on MSVC (OCCT defines `Handle_T` as a derived class). See
# third_party/opencascade-sys/PATCHES.md.
[patch.crates-io]
bite-gp-apple = { path = "third_party/bite-gp-apple" }
opencascade-sys = { path = "third_party/opencascade-sys" }
