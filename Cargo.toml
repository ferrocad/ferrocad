# FerroCAD — rust workspace.
#
# The project was formerly "freecad-rs-poc"; this workspace is the beginning of
# the deliverable layout. It is meant to grow into a standalone, drop-in
# replacement for FreeCAD's C++ App core: `ferrocad_core` is the pure model,
# `ferrocad_py` the PyO3 extension behind the `FreeCAD` Python namespace.
[workspace]
resolver = "3"
members = [
    "crates/ferrocad",
    "crates/ferrocad_types",
    "crates/ferrocad_theme",
    "crates/ferrocad_curves",
    "crates/ferrocad_text",
    "crates/ferrocad_core",
    "crates/ferrocad_lineage",
    "crates/ferrocad_geom",
    "crates/ferrocad_mesh",
    "crates/ferrocad_mesh_py",
    "crates/ferrocad_combined_py",
    "crates/ferrocad_occt",
    "crates/ferrocad_occt_wasm",
    "crates/ferrocad_web_gpui",
    "crates/ferrocad_wasm",
    "crates/ferrocad_part",
    "crates/ferrocad_part_gui",
    "crates/ferrocad_part_py",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
    "crates/ferrocad_inventor",
    "crates/ferrocad_graphics",
    "crates/ferrocad_stage",
    "crates/ferrocad_wgpu",
    "crates/ferrocad_snapshot",
    "crates/ferrocad_inventor_py",
    "crates/ferrocad_stage_py",
    "crates/ferrocad_ui",
    "crates/ferrocad_ui_py",
    "crates/ferrocad_viewport",
    "crates/ferrocad_widgets",
    "crates/ferrocad_shell_api",
    "crates/ferrocad_doc_api",
    "crates/ferrocad_shell_core",
    "crates/ferrocad_shell_rust",
    "crates/ferrocad_shell_js",
    "crates/ferrocad_shell_wasm",
    "crates/ferrocad_shell_web",
    "crates/ferrocad_shell_pywasm",
    "crates/ferrocad_addon",
    "crates/ferrocad_addon_toy",
    "crates/ferrocad_addon_spring",
    "crates/ferrocad_shell_python",
    "crates/ferrocad_parametric",
    "crates/ferrocad_toy",
    "crates/xtask",
]
# The GUI crates (`ferrocad_viewport`, `ferrocad_widgets`, `ferrocad_shell_core`,
# `ferrocad_shell_python`, `ferrocad`), the renderer (`ferrocad_wgpu`, which pulls in the
# whole GPU stack) and the pivy facade (`ferrocad_inventor_py`, which needs CPython
# headers), plus the OCCT-backed editions (`ferrocad_parametric`, via
# `ferrocad_part_py`), are workspace members so `-p <crate>` works, but they are
# excluded from `default-members` because building them is slow. The pure
# `ferrocad_graphics`, scene core `ferrocad_inventor`, `ferrocad_stage`,
# `ferrocad_mesh` (pure data: no kernel, no OCCT, no Python) and `ferrocad_part_gui`
# (presentation only: no kernel, no GPU, no CPython) stay in `default-members`.
# `ferrocad_shell_python` embeds CPython via PyO3 `auto-initialize`; it links fine in a
# full `cargo build --workspace` because the extension crates keep
# `pyo3/extension-module` opt-in (see their manifests), avoiding the libpython
# link conflict. `ferrocad_shell_core` must never depend on `pyo3` or a `*_py` crate.
default-members = [
    "crates/ferrocad_types",
    "crates/ferrocad_theme",
    "crates/ferrocad_curves",
    "crates/ferrocad_text",
    "crates/ferrocad_core",
    "crates/ferrocad_geom",
    "crates/ferrocad_mesh",
    "crates/ferrocad_graphics",
    "crates/ferrocad_inventor",
    "crates/ferrocad_stage",
    "crates/ferrocad_part_gui",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "LGPL-2.1-or-later"
readme = "README.md"
repository = "https://github.com/ferrocad/ferrocad"
homepage = "https://github.com/ferrocad/ferrocad"
rust-version = "1.87"

[workspace.dependencies]
ferrocad_addon = { path = "crates/ferrocad_addon" }
ferrocad_addon_spring = { path = "crates/ferrocad_addon_spring" }
include_dir = "0.7"
petgraph = "0.6"
# Q2a's `ferrocad_ui_py` consumes the workspace PyO3 pin; other extension
# crates still declare their own version/features. `abi3-py311` matches the
# FreeCAD 1.0 baseline.
pyo3 = { version = "0.25", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-segmentation = "1"
# Internal crates carry both a `path` (for development) and a `version` (which
# crates.io requires). Publish them in dependency order: `ferrocad_types`,
# `ferrocad_theme`, `ferrocad_graphics`, `ferrocad_core`, `ferrocad_geom`, `ferrocad_mesh`,
# `ferrocad_curves`, `ferrocad_text`, `ferrocad_occt`, `ferrocad_part`, `ferrocad_py`,
# `ferrocad_mesh_py`, `ferrocad_part_py`,
# `ferrocad_stage`,
# `ferrocad_part_gui`, `ferrocad_stage_py`, `ferrocad_viewport`, `ferrocad_widgets`,
# `ferrocad_shell_core`, `ferrocad_shell_python` and finally the `ferrocad` app. See
# docs/developer/architecture/releasing.md.
#
# Versions are per crate, not workspace-wide: a release may bump only the crates
# whose sources changed, so the publish workflow skips the rest (their version is
# already on crates.io). This release bumps all of them to 0.1.4 in lockstep.
# `[workspace.package] version` is the release/product version, which the release
# workflow checks the git tag against.
ferrocad_types = { path = "crates/ferrocad_types", version = "0.1.4" }
ferrocad_theme = { path = "crates/ferrocad_theme", version = "0.1.4" }
ferrocad_curves = { path = "crates/ferrocad_curves", version = "0.1.4" }
ferrocad_text = { path = "crates/ferrocad_text", version = "0.1.4" }
ferrocad_lineage = { path = "crates/ferrocad_lineage", version = "0.1.4" }
ferrocad_core = { path = "crates/ferrocad_core", version = "0.1.4" }
ferrocad_geom = { path = "crates/ferrocad_geom", version = "0.1.4" }
ferrocad_mesh = { path = "crates/ferrocad_mesh", version = "0.1.4" }
ferrocad_mesh_py = { path = "crates/ferrocad_mesh_py", version = "0.1.4" }
ferrocad_combined_py = { path = "crates/ferrocad_combined_py", version = "0.1.4" }
ferrocad_occt = { path = "crates/ferrocad_occt", version = "0.1.5" }
ferrocad_part = { path = "crates/ferrocad_part", version = "0.1.4" }
ferrocad_part_py = { path = "crates/ferrocad_part_py", version = "0.1.4" }
ferrocad_py = { path = "crates/ferrocad_py", version = "0.1.4" }
ferrocad_graphics = { path = "crates/ferrocad_graphics", version = "0.1.4" }
ferrocad_inventor = { path = "crates/ferrocad_inventor", version = "0.1.4" }
ferrocad_stage = { path = "crates/ferrocad_stage", version = "0.1.4" }
ferrocad_part_gui = { path = "crates/ferrocad_part_gui", version = "0.1.4" }
ferrocad_wgpu = { path = "crates/ferrocad_wgpu", version = "0.1.4" }
# Not published: link-time stubs for the prebuilt wasm OCCT, used by the browser
# shell host (`ferrocad_web_gpui`).
ferrocad_wasm = { path = "crates/ferrocad_wasm" }
ferrocad_viewport = { path = "crates/ferrocad_viewport", version = "0.1.4" }
ferrocad_inventor_py = { path = "crates/ferrocad_inventor_py", version = "0.1.4" }
ferrocad_stage_py = { path = "crates/ferrocad_stage_py", version = "0.1.4" }
ferrocad_ui = { path = "crates/ferrocad_ui", version = "0.1.4" }
ferrocad_widgets = { path = "crates/ferrocad_widgets", version = "0.1.4" }
# The platform-neutral shell (no CPython) and its native assembly. Both are new
# packages: the published `ferrocad_gpui` (up to 0.1.5) is retired; see
# `docs/developer/architecture/releasing.md` for the discontinuity.
ferrocad_shell_api = { path = "crates/ferrocad_shell_api", version = "0.1.5" }
# The document as JSON calls: the doorway a non-Rust script runtime shares. Core-only
# on purpose, so the wasm-Python half can depend on it without the kernel.
ferrocad_doc_api = { path = "crates/ferrocad_doc_api", version = "0.1.5" }
ferrocad_shell_rust = { path = "crates/ferrocad_shell_rust", version = "0.1.5" }
ferrocad_shell_js = { path = "crates/ferrocad_shell_js", version = "0.1.5" }
# The wasm-addon script half: a bundle's doorway over the document, hosted by
# `wasmi` on a native build.
ferrocad_shell_wasm = { path = "crates/ferrocad_shell_wasm", version = "0.1.5" }
ferrocad_shell_pywasm = { path = "crates/ferrocad_shell_pywasm", version = "0.1.5" }
# The browser host's runtime switch: it composes the document half above with one of
# the two browser script halves, or with none. Not published with the others (it is
# the browser's assembly, not a library a native host installs).
ferrocad_shell_web = { path = "crates/ferrocad_shell_web", version = "0.1.5" }
# Default features are off here so the browser host (which inherits this entry) does
# not compile the zero-copy presenter; the native assembly turns `gpu-interop` on.
ferrocad_shell_core = { path = "crates/ferrocad_shell_core", version = "0.1.5", default-features = false }
ferrocad_shell_python = { path = "crates/ferrocad_shell_python", version = "0.1.5" }
ferrocad = { path = "crates/ferrocad", version = "0.1.4" }

# Cargo cannot express "gpu-allocator must use the same `windows` crate as
# wgpu-hal". `gpu-allocator 0.28` accepts 0.53–0.62 while `sysinfo` caps at 0.57,
# so `Cargo.lock` pins gpu-allocator to `windows 0.62.2` (the version wgpu-hal
# uses). Mixing 0.57 with 0.62 breaks the DX12 API boundary on Windows
# (`ResourceCategory`, `ID3D12Heap`), which is how the Windows job failed on
# 2026-10-25. After `cargo update`, re-check that pin.
[workspace.metadata.gpu-allocator]
windows = "0.62.2"

# `lto` pays off for the extension/shared libraries; keep it workspace-wide.
[profile.release]
opt-level = 3
lto = true

# Optimise the layout engine in dev builds, and only it.
#
# A debug build cannot hide the layout pass: with `shell/timing.rs` splitting it, the
# 900a assembly reports `layout` 23-33 ms of which `prep` is 0.2 and `tree` is 1.5 -- so
# almost all of it is taffy solving and GPUI's prepaint walk at `opt-level = 0`, and no
# amount of caching in `shell/render.rs` can reach it.
#
# Named crates rather than `"*"`: the workspace crates stay debuggable and incremental,
# and only the three that run inside the pass are rebuilt. `bite-gp-engine-default` is
# where taffy is driven (`src/layout.rs`) and holds the text system; `bite-gp-authoring`
# is the engine crate (the published `gpui`) whose draw pass walks the element tree.
[profile.dev.package.taffy]
opt-level = 2

[profile.dev.package.bite-gp-engine-default]
opt-level = 2

[profile.dev.package.bite-gp-authoring]
opt-level = 2

# `opencascade-sys` 0.3.0 does not compile with MSVC: OCCT's `Handle_T` is a
# derived class there, not the `Handle(T)` alias. This resolves it to FerroCAD's
# fork, which carries upstream PR #234. The fork keeps the library name
# `opencascade_sys` and the cxx include prefix `opencascade-sys`, so it is a
# drop-in for the rest of the tree.
# https://github.com/ferrocad/ferrocad_occt_cxx
[patch.crates-io]
ferrocad_occt_cxx = { git = "https://github.com/ferrocad/ferrocad_occt_cxx", tag = "v0.3.0-ferrocad.29" }
