# FerroCAD — rust workspace.
#
# The project was formerly "freecad-rs-poc"; this workspace is the beginning of
# the deliverable layout. It is meant to grow into a standalone, drop-in
# replacement for FreeCAD's C++ App core: `ferrocad_core` is the pure model,
# `ferrocad_py` the PyO3 extension behind the `FreeCAD` Python namespace.
[workspace]
resolver = "3"
members = [
    "crates/ferrocad",
    "crates/ferrocad_core",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
    "crates/ferrocad_widgets",
    "crates/ferrocad_gpui",
]
# The GUI crates (`ferrocad_widgets`, `ferrocad_gpui`, `ferrocad`) are workspace
# members so `-p <crate>` works, but they are excluded from `default-members`
# because building them pulls in the whole GUI stack (a slow compile).
# `ferrocad_gpui` embeds CPython via PyO3 `auto-initialize`; it links fine in a
# full `cargo build --workspace` because the extension crates keep
# `pyo3/extension-module` opt-in (see their manifests), avoiding the libpython
# link conflict.
default-members = [
    "crates/ferrocad_core",
    "crates/ferrocad_py",
    "crates/ferrocad_gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
readme = "README.md"
repository = "https://github.com/ferrocad/ferrocad"
homepage = "https://github.com/ferrocad/ferrocad"
rust-version = "1.85"

[workspace.dependencies]
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# Internal crates carry both a `path` (for development) and a `version` (which
# crates.io requires). Publish them in dependency order: `ferrocad_core`, then
# `ferrocad_widgets`. `ferrocad_gpui` is not published (it is an application
# library; publishing `ferrocad` as a crate would require it first). See
# ../docs/releasing.md.
ferrocad_core = { path = "crates/ferrocad_core", version = "0.1.0" }
ferrocad_widgets = { path = "crates/ferrocad_widgets", version = "0.1.0" }
ferrocad_gpui = { path = "crates/ferrocad_gpui", version = "0.1.0" }

# `lto` pays off for the extension/shared libraries; keep it workspace-wide.
[profile.release]
opt-level = 3
lto = true
