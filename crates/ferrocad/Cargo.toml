[package]
name = "ferrocad"
# 0.0.0 is deliberate: this is a name reservation, not a release. See README.md.
version = "0.0.0"
# Not publishable yet: the app depends on ferrocad_gpui, which is unpublished.
publish = false
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD: a Rust reimplementation of FreeCAD's App core, exposed as the FreeCAD Python package"
keywords = ["cad", "freecad", "parametric"]
categories = ["science", "graphics"]
documentation = "https://docs.rs/ferrocad"

[lib]
name = "ferrocad"

# The base application: the general FerroCAD edition. Editions (FerroCAD:
# Architecture, ...) are thin binaries that depend on `ferrocad_gpui` directly.
[[bin]]
name = "ferrocad"
path = "src/main.rs"

[dependencies]
ferrocad_gpui.workspace = true
