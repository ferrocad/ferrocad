[package]
name = "ferrocad_gen"
version.workspace = true
edition.workspace = true
license.workspace = true
# Generated skeleton bindings; shipped in the wheel, never to crates.io.
publish = false
description = "Generated PyO3 skeleton bindings from FreeCAD .pyi stubs (M3c)"

[lib]
name = "ferrocad_gen"
crate-type = ["cdylib"]

[dependencies]
# `extension-module` is opt-in (see ferrocad_py) so a plain workspace build keeps
# linking libpython and the `ferrocad_gpui` binary links cleanly.
pyo3 = { version = "0.25", features = ["abi3-py310"] }

[features]
# Enabled by build.sh when producing the generated extension module.
extension-module = ["pyo3/extension-module"]
