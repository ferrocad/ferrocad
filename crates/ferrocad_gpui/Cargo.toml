[package]
name = "ferrocad_gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
# An application library; it ships inside the installer, not on crates.io.
publish = false
description = "FerroCAD's bite-gpui application shell: boots CPython and provides the window, panels and HostConfig"

[dependencies]
ferrocad_widgets.workspace = true
# `test-support` enables TestAppContext / VisualTestContext / #[gpui::test].
bite-gpui = { version = "1.21.0", features = ["test-support"] }
# Embedding CPython in the host (not the extension-module mode).
pyo3 = { version = "0.25", features = ["auto-initialize"] }
serde.workspace = true
serde_json.workspace = true
