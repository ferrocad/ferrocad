[package]
name = "ferrocad_host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spike: Rust host embedding CPython + bite-gpui (Python-declarative UI)"

[[bin]]
name = "ferrocad_host"
path = "src/main.rs"

[dependencies]
# `test-support` enables TestAppContext / VisualTestContext / #[gpui::test].
bite-gpui = { version = "1.21.0", features = ["test-support"] }
# Embedding CPython in the host (not the extension-module mode).
pyo3 = { version = "0.25", features = ["auto-initialize"] }
serde.workspace = true
serde_json.workspace = true
