# The OCCT implementation of the ferrocad_geom seam.
#
# Building this crate needs OCCT 7.8+; it is therefore a workspace member but NOT
# in `default-members`, so `cargo build`/`cargo test` do not require a kernel.
# See docs/developer/architecture/occt-integration.md and docs/developer/architecture/occt-bundling.md.
[package]
name = "ferrocad_occt"
version = "0.1.5"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "OCCT geometry backend for FerroCAD: implements the ferrocad_geom GeometryBackend"
keywords = ["cad", "freecad", "opencascade", "occt", "geometry"]
categories = ["science"]
documentation = "https://docs.rs/ferrocad_occt"

[lib]
name = "ferrocad_occt"

[dependencies]
ferrocad_geom.workspace = true
ferrocad_curves.workspace = true
ferrocad_types.workspace = true
opencascade-sys = { version = "0.3", package = "ferrocad_occt_cxx" }
ferrocad_part_cxx = { version = "0.1.0", git = "https://github.com/ferrocad/ferrocad_occt_cxx", tag = "v0.3.0-ferrocad.11" }
cxx = "1"
