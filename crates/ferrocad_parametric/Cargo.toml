# FerroCAD: Parametric — the first edition.
#
# A thin binary: it registers the Part workbench module as a built-in, then
# delegates to the base app (`ferrocad::run_as`). Everything expensive (the
# engine, the shell, the widget kit) is shared; the edition only adds a module and
# a window title. See `docs/developer/architecture/repackaging.md`.
#
# It needs OCCT (via `ferrocad_part_py`), so it is a workspace member but NOT in
# `default-members`, and it is an application binary, so it is NOT published.
[package]
name = "ferrocad_parametric"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "FerroCAD: Parametric — the base app plus the Part workbench"

[[bin]]
name = "ferrocad_parametric"
path = "src/main.rs"

[dependencies]
ferrocad.workspace = true
# The combined App/Part/Mesh/MeshPart extension: registering its built-ins is what
# puts `Part`, `Mesh` and `MeshPart` in this edition's embedded interpreter.
ferrocad_combined_py.workspace = true
# The Part workbench's manipulator (the edge dress-up arc), contributed to the shell.
ferrocad_part_gui.workspace = true
pyo3 = { version = "0.25", features = ["auto-initialize"] }

[dev-dependencies]
# The end-to-end test drives the same registry + Python bridge the shell uses.
ferrocad_shell_python.workspace = true
# The composed backend these tests exercise: the Rust document half, paired with
# that crate's `PythonScriptHost`.
ferrocad_shell_rust.workspace = true
ferrocad_shell_api.workspace = true
# B6: the surface suite compares the two **script halves** over one document, so the
# RustPython host is a test-only dependency (path-only; the crate is `publish = false`).
ferrocad_shell_pywasm = { path = "../ferrocad_shell_pywasm" }
# The surface suite compares the interpreter's `ferrocad._kernel_id` with this value,
# so a split image fails loudly.
ferrocad_core.workspace = true
ferrocad_geom.workspace = true
ferrocad_graphics.workspace = true
ferrocad_stage.workspace = true
ferrocad_types.workspace = true
ferrocad_viewport.workspace = true
ferrocad_inventor.workspace = true
ferrocad_wgpu.workspace = true
# B6 parses the RustPython host's JSON answers against the CPython bridge's rows.
serde_json.workspace = true
