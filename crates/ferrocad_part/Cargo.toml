# The Part workbench: the first module built on the document-object SPI.
#
# It registers `Part::Feature` (an object type) and `Part::PropertyPartShape` (a
# property value type) over the injected `ferrocad_geom::GeometryBackend`. The
# library itself depends only on the seam; its tests use the OCCT backend as a
# dev-dependency, so building the library needs no kernel — a workspace member,
# but NOT in `default-members`.
[package]
name = "ferrocad_part"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD Part workbench: Part::Feature and Part::PropertyPartShape over the OCCT backend"
keywords = ["cad", "freecad", "opencascade", "part"]
categories = ["science"]
documentation = "https://docs.rs/ferrocad_part"

[lib]
name = "ferrocad_part"

[dependencies]
ferrocad_core.workspace = true
ferrocad_geom.workspace = true
ferrocad_types.workspace = true

[dev-dependencies]
ferrocad_occt.workspace = true
serde_json.workspace = true
