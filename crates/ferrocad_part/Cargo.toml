# The Part workbench: the first module built on the document-object SPI.
#
# It registers `Part::Feature` (an object type) and `Part::PropertyPartShape` (a
# property value type), both over the OCCT backend (`ferrocad_occt`). It therefore
# needs OCCT to build — a workspace member, but NOT in `default-members`.
[package]
name = "ferrocad_part"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD Part workbench: Part::Feature and Part::PropertyPartShape over the OCCT backend"
keywords = ["cad", "freecad", "opencascade", "part"]
categories = ["science"]
documentation = "https://docs.rs/ferrocad_part"

[lib]
name = "ferrocad_part"

[dependencies]
ferrocad_core.workspace = true
ferrocad_geom.workspace = true
ferrocad_occt.workspace = true
ferrocad_types.workspace = true

[dev-dependencies]
serde_json.workspace = true
