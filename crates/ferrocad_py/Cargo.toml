[package]
name = "ferrocad_py"
version = "0.1.2"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing ferrocad_core to Python (importable as `ferrocad`)"
keywords = ["cad", "freecad", "pyo3", "python"]
categories = ["api-bindings"]
documentation = "https://docs.rs/ferrocad_py"

[lib]
name = "ferrocad_py"
# `cdylib` for the maturin wheel; `rlib` so the `ferrocad` app can link the module
# in directly (then no platform-specific extension file ships in the app).
crate-type = ["cdylib", "rlib"]

[dependencies]
ferrocad_core.workspace = true
# NOTE: `extension-module` is deliberately *not* a hard dependency feature. It
# tells PyO3 not to link libpython, which is correct for a packaged extension
# module but breaks `cargo build --workspace` (the `ferrocad_gpui` bin needs the
# libpython symbols). It is enabled only when packaging the extension.
pyo3 = { version = "0.25", features = ["abi3-py310"] }

[features]
# Enabled by maturin / build.sh when producing the Python extension module.
extension-module = ["pyo3/extension-module"]
