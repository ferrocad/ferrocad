[package]
name = "ferrocad_py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings exposing ferrocad_core to Python (importable as `ferrocad`)"

[lib]
name = "ferrocad_py"
crate-type = ["cdylib"]

[dependencies]
ferrocad_core = { path = "../ferrocad_core" }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
