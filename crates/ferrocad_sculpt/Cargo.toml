# FerroCAD: Sculpt — the freeform edition.
#
# A thin binary: it registers the combined App/Part/Mesh module set as builtins,
# then delegates to the base app (`ferrocad::run_edition_with_script`) with its
# own app script (`ferrocad_sculpt`). It shares the whole composition with the
# Parametric edition — same engine, shell, widget kit and Part module — and adds
# only the Sculpt command surface and the cage sample.
#
# It needs OCCT (via `ferrocad_combined_py`), so it is a workspace member but NOT
# in `default-members`, and it is an application binary, so it is NOT published.
# See `docs/developer/architecture/edition-publishing.md`.
[package]
name = "ferrocad_sculpt"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "FerroCAD: Sculpt — the base app plus the Sculpt workbench"

[[bin]]
name = "ferrocad_sculpt"
path = "src/main.rs"

[dependencies]
ferrocad.workspace = true
# The combined App/Part/Mesh/MeshPart extension: registering its built-ins is what
# puts `Part`, `Mesh` and `MeshPart` in this edition's embedded interpreter, which
# is what `python/Sculpt` builds its cage and skin on.
ferrocad_combined_py.workspace = true
pyo3 = { version = "0.25", features = ["auto-initialize"] }

[dev-dependencies]
# The composition test boots the edition's own app script through the same host
# the shell uses (one interpreter, one document registry).
ferrocad_shell_python.workspace = true

[features]
# Same script-half selection as the Parametric edition: the desktop composes
# CPython plus the QuickJS page by default.
default = ["js"]
js = ["ferrocad/js"]
pywasm = ["ferrocad/pywasm"]
addons = ["ferrocad/addons"]
