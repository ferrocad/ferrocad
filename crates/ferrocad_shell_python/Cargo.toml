[package]
name = "ferrocad_shell_python"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD's native shell assembly: embeds CPython, implements the shell's AppBackend and exports the native entry points"
keywords = ["cad", "gui", "gpui", "freecad"]
categories = ["gui"]
documentation = "https://docs.rs/ferrocad_shell_python"

[dependencies]
# The platform-neutral shell: window, chrome, panels, viewport element and the
# `AppBackend` seam. Every public path is re-exported below.
ferrocad_shell_core = { workspace = true, features = ["gpu-interop"] }
# The scene a scripted tool and the event listener hand back.
ferrocad_inventor.workspace = true
# `Tool` is the trait the backend's scripted bridge returns.
ferrocad_stage.workspace = true
# The `pivy.coin` facade: the host registers it into the embedded interpreter and
# extracts the scene a workbench script builds.
ferrocad_inventor_py.workspace = true
# The modern-stack Python surface (`ferrocad.stage`), registered alongside `pivy.coin`.
ferrocad_stage_py.workspace = true
# Headless rendering: the offscreen readback and the scene it compiles.
ferrocad_viewport.workspace = true
ferrocad_wgpu.workspace = true
ferrocad_types.workspace = true
# The seam's vocabulary and the command catalogue the script half filters against.
ferrocad_shell_api.workspace = true
# The document half the desktop composes this crate's `PythonScriptHost` with.
ferrocad_shell_rust.workspace = true
bite-gpui = { version = "=1.25.203" }
# Embedding CPython in the host (not the extension-module mode).
pyo3 = { version = "0.25", features = ["auto-initialize"] }
serde.workspace = true
serde_json.workspace = true
# The image path wraps readback pixels as a gpui `RenderImage`, which holds
# `image::Frame`s; gpui does not re-export the `image` crate.
image = "0.25"

[dev-dependencies]
# `test-support` enables TestAppContext / VisualTestContext / #[gpui::test].
bite-gpui = { version = "=1.25.203", features = ["test-support"] }
