[package]
name = "ferrocad_shell_pywasm"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD's wasm-Python scripting surface: ScriptHost over RustPython"
keywords = ["cad", "freecad", "wasm"]
categories = ["graphics"]
documentation = "https://docs.rs/ferrocad_shell_pywasm"
publish = false

[dependencies]
# The scripting half of the seam; the document half stays `ferrocad_shell_rust`'s
# (or, for a host with no document of its own, the snapshot the bridge renders from
# `ferrocad_core`).
ferrocad_shell_api.workspace = true
# The seam written once: this crate supplies the RustPython `PythonRuntime`, not a
# second copy of the 35 `ScriptHost` methods (B18).
ferrocad_python_host.workspace = true
ferrocad_core.workspace = true
# B18b item 2: the 3D kernel a Python script builds with. The same `ferrocad_part`,
# `ferrocad_mesh` and OCCT the document half links, so a script's shape and a
# document's `Part::Box` are one shape type (and the browser already carries this
# kernel for `DocumentBackend`).
ferrocad_part.workspace = true
ferrocad_mesh.workspace = true
ferrocad_geom.workspace = true
# `Part.makePolygon` builds the same `EdgeCurve`s `ferrocad_part_py` does, so a polygon
# is one implementation rather than a second one here.
ferrocad_curves.workspace = true
ferrocad_occt.workspace = true
# The Qt Designer `.ui` reader whose state machine the `ferrocad_ui_py` module drives
# (B18b item 2): the same crate `ferrocad_ui_py` (PyO3) binds, so a panel and its
# proxy tree are one source on both runtimes.
ferrocad_ui.workspace = true
# The one document presenter every script runtime uses (the Python facade here, the
# addon verbs in `ferrocad_doc_api`). Core-only, so it brings no kernel.
ferrocad_doc_api.workspace = true
# The event vocabulary an `EventListener` receives, and the `Tool` its signature uses.
ferrocad_inventor.workspace = true
ferrocad_stage.workspace = true
# `ferrocad_stage::view` publishes a `ferrocad_graphics::Camera` the `Camera` binding
# wraps, and a pick returns its `Hit`. Same graphics crate the document half links.
ferrocad_graphics.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"

# RustPython, the §6.3 runtime this crate picks: a Python VM written in Rust, so it
# needs no C ABI and no Pyodide download.
# `rustpython-vm`'s default features include `host_env`, which compiles the `os` and
# `_io` file layer; that needs a POSIX module `wasm32-unknown-unknown` does not have.
# Without it the VM, the compiler and the frozen standard library still build, and
# `json`/`sys` work — which is all `python/ferrocad_shell` needs for `properties()`.
#
# The ruff-python crates this family resolves (0.16.5) declare `rustc 1.96`, which is
# why the workspace's `rust-version` is 1.97: 0.6 is the release that casts
# `libc::POSIX_SPAWN_SETSID` itself, so no `libc` pin is needed.
rustpython-vm = { version = "0.6.0", default-features = false, features = [
    "compiler",
    "freeze-stdlib",
    "importlib",
    "encodings",
    "stdio",
    # The browser's entropy source: `rustpython-common/wasm_js` gives `getrandom` a
    # backend for `wasm32-unknown-unknown` (paired with the cfg in `.cargo/config.toml`).
    "wasmbind",
] }
# `default-features = false` keeps `host_env` off, matching the line above.
rustpython-stdlib = { version = "0.6.0", default-features = false, features = ["compiler"] }
rustpython-pylib = { version = "0.6.0", features = ["freeze-stdlib"] }

# The ruff AST these crates share, held at 0.16.5. `rustpython-codegen 0.6.0` was
# released against 0.16.5; the caret range in the family's manifests resolves 0.16.10,
# which moved `ExprCompare`'s fields and `FStringValue`, and codegen then fails to
# compile. Cargo cannot pin a transitive dependency, so the pin is expressed here as an
# exact requirement: it survives `cargo update`, costs nothing (they are already in the
# graph through `rustpython-stdlib`), and if a later RustPython needs another AST the
# resolution fails loudly instead of the build failing inside a dependency.
rustpython-ruff_python_ast = { version = "=0.16.5" }
rustpython-ruff_python_parser = { version = "=0.16.5" }
rustpython-ruff_python_trivia = { version = "=0.16.5" }
rustpython-ruff_source_file = { version = "=0.16.5" }
rustpython-ruff_text_size = { version = "=0.16.5" }

# The desktop's interpreter gets a real host environment (B18b item 3): `os`, `_io` and
# the POSIX layer, which `wasm32-unknown-unknown` cannot have. Features are additive and
# this declaration is target-scoped, so only a native build gets `host_env`; the browser
# keeps the embedded file map.
#
# 0.6 moved the POSIX layer into `rustpython-host_env`, and it casts
# `libc::POSIX_SPAWN_SETSID` there, so any `libc` release links.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustpython-vm = { version = "0.6.0", default-features = false, features = ["host_env"] }
