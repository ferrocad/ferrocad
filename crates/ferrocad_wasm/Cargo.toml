# Link-time WASI stubs shared by the browser hosts.
#
# The prebuilt wasm OCCT is a `wasm32-wasip1` build, so linking it into a
# `wasm32-unknown-unknown` cdylib leaves the libc wrappers it kept as undefined
# WASI imports. Defining them in the module makes the shipped artefact import
# nothing, which is what lets wasm-bindgen's `--target web` glue load it without
# a WASI polyfill. See src/lib.rs and crates/ferrocad_web_gpui/README.md.
[package]
name = "ferrocad_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Link-time WASI stubs for FerroCAD's browser hosts (OCCT wasm kernel)"
