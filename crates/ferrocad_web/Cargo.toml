# The demo host for the wasm kernel: a filleted box, drawn on a canvas.
#
# Built for `wasm32-unknown-unknown` against a prebuilt wasm OCCT (see the fork's
# build script and `docs/project/research/occt-8-upgrade.md` §2.2). It is a
# workspace member but NOT in `default-members`: it links the kernel and, on wasm,
# needs the cross image. The surface, device and orbit/zoom input live in
# `ferrocad_web_viewport`; this crate is only the scene and the demo pose.
[package]
name = "ferrocad_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Browser (wasm32) demo host for the FerroCAD OCCT kernel"

[lib]
name = "ferrocad_web"
crate-type = ["cdylib"]

[dependencies]
# The document and the Part workbench: the demo drives a real `Document::recompute`
# (box + fillet), not the kernel directly.
ferrocad_core.workspace = true
ferrocad_part.workspace = true
# Geometry and the kernel behind the Part objects.
ferrocad_geom.workspace = true
ferrocad_occt.workspace = true
# Draw contract and the declarative producer.
ferrocad_graphics.workspace = true
ferrocad_types.workspace = true
ferrocad_stage.workspace = true
# The canvas surface, wgpu device and pointer/wheel navigation.
ferrocad_web_viewport = { path = "../ferrocad_web_viewport" }
# Link-time WASI stubs for the wasm OCCT kernel, shared with `ferrocad_web_gpui`.
ferrocad_wasm.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "console",
] }
console_error_panic_hook = "0.1"
