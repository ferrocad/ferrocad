<!doctype html>
<meta charset="utf-8">
<title>FerroCAD wasm kernel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1218 }
  /* `touch-action: none`: the canvas owns the drag, not the page's scroll gesture. */
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab }
  #hint {
    position: fixed; left: 1rem; bottom: 0.75rem; margin: 0;
    font: 0.8125rem/1.4 system-ui, sans-serif; color: #6b7480;
    pointer-events: none; user-select: none;
  }
</style>
<canvas id="cad" width="960" height="600"></canvas>
<p id="hint">drag to orbit · scroll to zoom</p>
<script type="module">
  import init from "./pkg/ferrocad_web.js";
  init().catch((error) => {
    document.body.textContent = String(error);
    console.error(error);
  });
</script>
