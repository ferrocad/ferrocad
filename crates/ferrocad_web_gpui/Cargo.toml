# The browser host: the real FerroCAD shell (`ferrocad_shell_core`) in a GPUI window
# on WebGL2, with a Rust `AppBackend` and no CPython anywhere in the graph.
#
# Built for `wasm32-unknown-unknown` only; see README.md. The document is a real
# `ferrocad_core::Document` (`Part::Box` + `Part::Fillet`) and its geometry comes from
# the OCCT kernel compiled to wasm; the viewport composites that scene zero-copy on
# the window's own wgpu device.
[package]
name = "ferrocad_web_gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Browser (wasm32) FerroCAD shell: ferrocad_shell_core on GPUI's WebGL2 backend"

[lib]
name = "ferrocad_web_gpui"
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
# The GUI framework, with its browser backend: `bite-gp-web` gives one
# document-owned canvas, WebGPU preferred and WebGL2 as the fallback we force.
# 1.25.203's default feature set is `platform`; `multithreaded` is opt-in again
# (it would pull the nightly-only `wasm_thread`).
gpui = { package = "bite-gpui", version = "=1.25.203" }
# The platform-neutral shell: `Shell`, the chrome, panels and the `AppBackend` seam.
# `gpu-interop` is the browser's only presentation path: the presenter negotiates
# with the window's own wgpu device on the first paint and composites the viewport
# with `paint_texture` (same device, no dma-buf, no readback).
ferrocad_shell_core = { workspace = true, features = ["gpu-interop"] }
# The engine: a real document on the Part workbench, tessellated by the prebuilt wasm
# OCCT kernel. `ferrocad_wasm` supplies the link-time WASI stubs the kernel's
# wasi-sdk build leaves behind; `main` must retain them before the first kernel call.
ferrocad_core.workspace = true
ferrocad_part.workspace = true
ferrocad_occt.workspace = true
# The built-in command catalogue: the same table the native registry reads from
# `python/ferrocad_shell/catalog.json`, so both hosts spell a label the same way.
ferrocad_shell_api.workspace = true
ferrocad_geom.workspace = true
ferrocad_stage.workspace = true
ferrocad_types.workspace = true
ferrocad_wasm.workspace = true
# The Move form's values arrive as JSON, as they do on the native bridge.
serde_json.workspace = true
wasm-bindgen = "0.2"
# The logger `gpui::web_init` installs forwards to the browser console.
log = "0.4"
