# The step-2 browser probe: a GPUI window compositing a wgpu surface.
#
# It exercises the seam `ferrocad_gpui`'s interop presenter needs on wasm — the
# window renderer's device (`GpuRenderer::device`), a `WgpuSurface` allocated on
# that device, and `paint_texture` — without CPython, the document layer or the
# OCCT kernel. Built for `wasm32-unknown-unknown` only; see README.md.
[package]
name = "ferrocad_web_gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Browser (wasm32) probe: a GPUI window compositing a wgpu surface through gpui_interop"

[lib]
name = "ferrocad_web_gpui"
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
# The GUI framework, with its browser backend: `bite-gp-web` gives one
# document-owned canvas, WebGPU preferred and WebGL2 as the fallback we force.
# 1.25 added `multithreaded` to `bite-gpui`'s defaults, which turns on
# `bite-gp-web/multithreaded` and with it `wasm_thread` — a nightly-only
# `#![feature(stdarch_wasm_atomic_wait)]`. Nothing here uses worker threads, so
# take the same default set 1.24 had (`platform`) and leave `multithreaded` off.
gpui = { package = "bite-gpui", version = "=1.25.202", default-features = false, features = ["platform"] }
# The renderer, and the `ImportedTextureExt` that turns a texture made on its
# device into a handle GPUI can composite. `wasm-interop` re-enables that impl in
# our vendored copy; see third_party/bite-gp-wgpu/PATCHES.md.
gpui_wgpu = { package = "bite-gp-wgpu", version = "=1.25.202", features = ["wasm-interop"] }
# `WgpuSurface`: the same-device offscreen target, no dma-buf and no fence.
gpui_interop = { version = "0.2.0", default-features = false, features = ["gpui", "wgpu"] }
# The real scene path: the stage's draw packets, the camera, and the renderer
# that the canvas demo uses. This is the same trio `ferrocad_web_viewport` drives.
ferrocad_graphics.workspace = true
ferrocad_stage.workspace = true
ferrocad_wgpu.workspace = true
ferrocad_geom.workspace = true
ferrocad_types.workspace = true
# The document layer and the kernel behind it: the scene is a `Part::Box` with a
# `Part::Fillet`, recomputed, not hand-built geometry. On wasm this links the
# prebuilt OCCT kernel (see README.md for the cross-image build).
ferrocad_core.workspace = true
ferrocad_part.workspace = true
ferrocad_occt.workspace = true
# Link-time WASI stubs for the wasm OCCT kernel, shared with `ferrocad_web`.
ferrocad_wasm.workspace = true
# `fragile-send-sync-non-atomic-wasm` is what makes wgpu's wasm handles
# `Send + Sync`, which the imported-texture handle requires. Without it the
# interop path does not typecheck for wasm.
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
# The logger `gpui::web_init` installs forwards to the browser console; the probe
# reports through it instead of drawing text (see README.md).
log = "0.4"
