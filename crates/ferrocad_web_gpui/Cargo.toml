# The browser host: the real FerroCAD shell (`ferrocad_shell_core`) in a GPUI window
# on WebGL2, with a Rust `AppBackend` and no CPython anywhere in the graph.
#
# Built for `wasm32-unknown-unknown` only; see README.md. The 3D viewport is presented
# zero-copy by `ferrocad_shell_core`'s interop presenter on the window's own wgpu
# device; no kernel is linked yet, so the scene is a hand-built sample stage.
[package]
name = "ferrocad_web_gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Browser (wasm32) FerroCAD shell: ferrocad_shell_core on GPUI's WebGL2 backend"

[lib]
name = "ferrocad_web_gpui"
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
# The GUI framework, with its browser backend: `bite-gp-web` gives one
# document-owned canvas, WebGPU preferred and WebGL2 as the fallback we force.
# 1.25.203's default feature set is `platform`; `multithreaded` is opt-in again
# (it would pull the nightly-only `wasm_thread`).
gpui = { package = "bite-gpui", version = "=1.25.203" }
# The platform-neutral shell: `Shell`, the chrome, panels and the `AppBackend` seam.
# `gpu-interop` is the browser's only presentation path: the presenter negotiates
# with the window's own wgpu device on the first paint and composites the viewport
# with `paint_texture` (same device, no dma-buf, no readback).
ferrocad_shell_core = { workspace = true, features = ["gpu-interop"] }
# `gpu-interop` compiles the presenter against `gpui_wgpu`, whose imported-texture
# impl exists on wasm only with `wasm-interop` (it turns on wgpu's
# `fragile-send-sync-non-atomic-wasm`). The web host is the crate that needs the
# impl, so it is declared here as a wasm-only dependency.
gpui_wgpu = { package = "bite-gp-wgpu", version = "=1.25.203", features = ["wasm-interop"] }
wasm-bindgen = "0.2"
# The logger `gpui::web_init` installs forwards to the browser console.
log = "0.4"
