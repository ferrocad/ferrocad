<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FerroCAD · browser shell</title>
  <style>
    /* GPUI's web platform appends its own full-size canvas to `body`. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101014; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // `--target web` glue. `init` instantiates the module, which runs the
    // `#[wasm_bindgen(start)]` entry point (log setup, then GPUI's application).
    import init, { ferrocad_open } from "./pkg/ferrocad_web_gpui.js";

    const params = new URLSearchParams(location.search);

    // The loader's half of the document doorway. `JsScriptHost::with_kernel` calls this
    // once at boot with a function that reaches the host's one document (JSON in, JSON
    // out). A page without this line still renders the shell; only an addon that edits
    // the document is missing.
    window.__ferrocadInstallKernel = (call) => {
      window.ferrocad = { call };
    };
    // `?reopen=1` captures the next save instead of downloading it, then opens those
    // bytes again -- the save/open round trip through the real commands.
    const captureSave = params.has("reopen");
    let saved = null;

    // The page owns what Rust cannot do: the file picker and the download. The host
    // calls these two; `ferrocad_open` (the wasm export) hands a chosen file back.
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".FCStd,.fcstd";
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);

    const fileName = (name) =>
      /\.fcstd$/i.test(name) ? name : `${name}.FCStd`;

    const openFile = async (file) => {
      const bytes = new Uint8Array(await file.arrayBuffer());
      try {
        const status = ferrocad_open(file.name, bytes);
        console.log("ferrocad harness: open ->", status);
      } catch (error) {
        console.log("ferrocad harness: open failed:", String(error));
      }
    };

    window.__ferrocad = {
      requestOpen() {
        console.log("ferrocad harness: open requested");
        fileInput.click();
      },
      download(name, bytes) {
        console.log("ferrocad harness: save", name, bytes.length);
        if (captureSave) {
          // Rust passes `&[u8]` to JS as a view into wasm memory, valid only for
          // this call; copy before keeping it.
          saved = { name, bytes: new Uint8Array(bytes) };
          return;
        }
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName(name);
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      },
    };

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      // Clearing the value lets the same file be chosen twice.
      fileInput.value = "";
      if (file) await openFile(file);
    });

    // A dropped `.FCStd` opens it, the way a desktop app accepts a dragged document.
    document.addEventListener("dragover", (event) => event.preventDefault());
    document.addEventListener("drop", async (event) => {
      event.preventDefault();
      const file = event.dataTransfer?.files?.[0];
      if (file) await openFile(file);
    });

    // `?js=1` installs the page's JS scripting surface before the module boots, so
    // its command list is part of the first `commands()` read. `?runtime=js` is the
    // same request in the longer form the Rust switch also understands, and a chain
    // (`?runtime=pywasm,js`) names it as one element, so both spellings install it.
    if (params.has("js") || (params.get("runtime") ?? "").split(",").some((name) => name.trim() === "js")) {
      const { install } = await import("./js-demo.js");
      install();
    }

    // `?addons=1` loads the JS workbench bundle and `?addons=wasm` the wasm one. Both
    // register before the module boots, so their commands are part of the first
    // `commands()` read, and both reach the document through `window.ferrocad.call`
    // (installed from the host's doorway).
    const addons = params.get("addons");
    if (addons === "wasm") {
      const { install } = await import("./addons/toy-wasm.js");
      await install();
    } else if (params.has("addons")) {
      const { install } = await import("./addons/toy.js");
      install();
    }

    await init();

    // `?select=x,y` clicks a row, then `?keys=` and `?type=` drive the keyboard.
    // Together they let a headless capture exercise the editing path: select an
    // object, run an accelerated command, type a value into a field, commit with
    // Enter. GPUI's web backend takes keyboard input through a hidden IME mirror
    // (`body > textarea`), which is where these events go.
    if (params.has("select") || params.has("keys") || params.has("type") || params.has("save") || params.has("reopen") || params.has("probe")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      const mirror = document.querySelector("body > textarea");
      if (canvas && mirror) {
        const press = (x, y, buttons) =>
          ["pointerdown", "pointerup"].forEach((type, index) =>
            canvas.dispatchEvent(
              new PointerEvent(type, {
                pointerId: 1,
                pointerType: "mouse",
                isPrimary: true,
                clientX: x,
                clientY: y,
                buttons: index === 0 ? buttons : 0,
                bubbles: true,
                cancelable: true,
              }),
            ),
          );
        // A held-button drag, one pointer per call: the scrub handles and the
        // viewport read moves only while `buttons` reports the press.
        const drag = async (x1, y1, x2, y2) => {
          const fire = (type, x, y, buttons) =>
            canvas.dispatchEvent(
              new PointerEvent(type, {
                pointerId: 1,
                pointerType: "mouse",
                isPrimary: true,
                clientX: x,
                clientY: y,
                buttons,
                bubbles: true,
                cancelable: true,
              }),
            );
          fire("pointerdown", x1, y1, 1);
          for (let step = 1; step <= 8; step += 1) {
            fire("pointermove", x1 + ((x2 - x1) * step) / 8, y1 + ((y2 - y1) * step) / 8, 1);
            await new Promise((resolve) => setTimeout(resolve, 5));
          }
          fire("pointerup", x2, y2, 0);
        };
        // `ctrl-shift-m`, `space`, `enter`, `backspace` or one character.
        const key = (spec) => {
          const parts = spec.split("-");
          const name = parts.pop();
          const named = {
            space: " ",
            enter: "Enter",
            escape: "Escape",
            tab: "Tab",
            backspace: "Backspace",
            delete: "Delete",
          };
          mirror.dispatchEvent(
            new KeyboardEvent("keydown", {
              key: named[name] ?? name,
              ctrlKey: parts.includes("ctrl"),
              shiftKey: parts.includes("shift"),
              altKey: parts.includes("alt"),
              bubbles: true,
              cancelable: true,
            }),
          );
        };
        if (params.has("select")) {
          const [x, y] = params.get("select").split(",").map(Number);
          press(x, y, 1);
          // Selecting an object builds the property rows on the next frames. The
          // hit test a click uses is computed from the *rendered* frame, so give the
          // pane time to lay out before any later press targets a row.
          await new Promise((resolve) => setTimeout(resolve, 900));
        }
        if (params.has("keys")) {
          // Steps are `;`-separated so a `move:x,y` step keeps its comma:
          // `keys=space;move:600,384;space` is "open the wheel, hover Hide, commit".
          for (const spec of params.get("keys").split(";")) {
            if (spec.startsWith("press:")) {
              const [x, y] = spec.slice(6).split(",").map(Number);
              press(x, y, 1);
            } else if (spec.startsWith("wait:")) {
              await new Promise((resolve) => setTimeout(resolve, Number(spec.slice(5))));
            } else if (spec.startsWith("move:")) {
              const [x, y] = spec.slice(5).split(",").map(Number);
              canvas.dispatchEvent(
                new PointerEvent("pointermove", {
                  pointerId: 1,
                  pointerType: "mouse",
                  isPrimary: true,
                  clientX: x,
                  clientY: y,
                  buttons: 0,
                  bubbles: true,
                  cancelable: true,
                }),
              );
            } else if (spec.startsWith("wheel:")) {
              const [x, y] = spec.slice(6).split(",").map(Number);
              canvas.dispatchEvent(
                new WheelEvent("wheel", {
                  deltaY: 240,
                  clientX: x,
                  clientY: y,
                  bubbles: true,
                  cancelable: true,
                }),
              );
            } else if (spec.startsWith("drag:")) {
              const [x1, y1, x2, y2] = spec.slice(5).split(",").map(Number);
              await drag(x1, y1, x2, y2);
            } else {
              key(spec);
            }
            await new Promise((resolve) => setTimeout(resolve, 80));
          }
        }
        if (params.has("type")) {
          const [x, y, text] = params.get("type").split(",");
          // A real pointer hovers before it presses; the field's hitbox only claims
          // the press once the move has made it the hovered element. The move is sent
          // twice: the first may land before the pane has laid out, and the hit test
          // is taken from the rendered frame of the preceding move.
          const hover = () =>
            canvas.dispatchEvent(
              new PointerEvent("pointermove", {
                pointerId: 1,
                pointerType: "mouse",
                isPrimary: true,
                clientX: Number(x),
                clientY: Number(y),
                buttons: 0,
                bubbles: true,
                cancelable: true,
              }),
            );
          hover();
          await new Promise((resolve) => setTimeout(resolve, 400));
          hover();
          await new Promise((resolve) => setTimeout(resolve, 400));
          press(Number(x), Number(y), 1);
          await new Promise((resolve) => setTimeout(resolve, 300));
          // The field keeps its old value on focus, so clear it first. Every key
          // goes through the same `keydown` path a real browser sends; GPUI inserts
          // printable characters into the focused input handler from there.
          for (let i = 0; i < 12; i += 1) key("backspace");
          await new Promise((resolve) => setTimeout(resolve, 50));
          for (const character of text) {
            key(character);
            await new Promise((resolve) => setTimeout(resolve, 20));
          }
          await new Promise((resolve) => setTimeout(resolve, 50));
          key("enter");
        }

        // `?probe=1` reads the document back through the doorway once the synthetic
        // input has settled. The shell draws its tree into the canvas, so the DOM
        // cannot show a new object; the doorway's own JSON is the honest probe.
        if (params.has("probe")) {
          await new Promise((resolve) => setTimeout(resolve, 300));
          if (window.ferrocad) {
            console.log(
              "ferrocad harness: document",
              window.ferrocad.call('{"call":"document"}'),
            );
          } else {
            console.log("ferrocad harness: document unavailable (no doorway)");
          }
        }

        // `?save=1` runs Save through the shell's accelerator; the page logs the
        // bytes it is asked to download. `?reopen=1` captures those bytes and opens
        // them again, so the same run proves save and open.
        if (params.has("save") || params.has("reopen")) {
          key("ctrl-s");
          await new Promise((resolve) => setTimeout(resolve, 200));
          if (params.has("reopen")) {
            if (saved) {
              try {
                const status = ferrocad_open("reopened.FCStd", saved.bytes);
                console.log("ferrocad harness: reopened ->", status);
              } catch (error) {
                console.log("ferrocad harness: reopen failed:", String(error));
              }
            } else {
              console.log("ferrocad harness: reopen captured no bytes");
            }
          }
        }
      }
    }

    // `?click=x,y` fires one pointer press/release at a client coordinate, so a
    // headless capture can drive the shell (select a tree row, run a header command).
    if (new URLSearchParams(location.search).has("click")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      const [x, y] = new URLSearchParams(location.search)
        .get("click")
        .split(",")
        .map(Number);
      if (canvas) {
        const fire = (type, buttons) =>
          canvas.dispatchEvent(
            new PointerEvent(type, {
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true,
              clientX: x,
              clientY: y,
              buttons,
              bubbles: true,
              cancelable: true,
            }),
          );
        fire("pointerdown", 1);
        fire("pointerup", 0);
      }
    }

    // `?drag=1` synthesises one pointer drag across the canvas, so a headless
    // screenshot can show that `surface_input` drives the camera. Real pointer
    // input needs none of this.
    if (new URLSearchParams(location.search).has("drag")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        const x = rect.left + rect.width * 0.3;
        const y = rect.top + rect.height * 0.3;
        const fire = (type, dx, dy, buttons) =>
          canvas.dispatchEvent(
            new PointerEvent(type, {
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true,
              clientX: x + dx,
              clientY: y + dy,
              buttons,
              bubbles: true,
              cancelable: true,
            }),
          );
        fire("pointerdown", 0, 0, 1);
        for (let i = 1; i <= 12; i += 1) fire("pointermove", i * 8, i * 3, 1);
        fire("pointerup", 96, 36, 0);
      }
    }

    // `?wheel=1` synthesises one scroll notch, for the zoom handler.
    if (new URLSearchParams(location.search).has("wheel")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        canvas.dispatchEvent(
          new WheelEvent("wheel", {
            deltaY: 240,
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + rect.height / 2,
            bubbles: true,
            cancelable: true,
          }),
        );
      }
    }

    // `?dblclick=1` drags and then double-clicks: the second down must carry a
    // click count of 2, which recentres the camera on the demo pose.
    if (new URLSearchParams(location.search).has("dblclick")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const fire = (type, cx, cy, buttons) =>
          canvas.dispatchEvent(
            new PointerEvent(type, {
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true,
              clientX: cx,
              clientY: cy,
              buttons,
              bubbles: true,
              cancelable: true,
            }),
          );
        // A drag first, so the recentre is visible.
        fire("pointerdown", x, y, 1);
        for (let i = 1; i <= 12; i += 1) fire("pointermove", x + i * 8, y + i * 3, 1);
        fire("pointerup", x + 96, y + 36, 0);
        // Then two clicks in quick succession at one spot.
        for (let i = 0; i < 2; i += 1) {
          fire("pointerdown", x, y, 1);
          fire("pointerup", x, y, 0);
        }
      }
    }
  </script>
</body>
</html>
