<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FerroCAD · GPUI browser probe</title>
  <style>
    /* GPUI's web platform appends its own full-size canvas to `body`. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101014; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // `--target web` glue. `init` instantiates the module, which runs the
    // `#[wasm_bindgen(start)]` entry point (log setup, then GPUI's application).
    import init from "./pkg/ferrocad_web_gpui.js";
    await init();

    // `?drag=1` synthesises one pointer drag across the canvas, so a headless
    // screenshot can show that `surface_input` drives the camera. Real pointer
    // input needs none of this.
    if (new URLSearchParams(location.search).has("drag")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        const x = rect.left + rect.width * 0.3;
        const y = rect.top + rect.height * 0.3;
        const fire = (type, dx, dy, buttons) =>
          canvas.dispatchEvent(
            new PointerEvent(type, {
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true,
              clientX: x + dx,
              clientY: y + dy,
              buttons,
              bubbles: true,
              cancelable: true,
            }),
          );
        fire("pointerdown", 0, 0, 1);
        for (let i = 1; i <= 12; i += 1) fire("pointermove", i * 8, i * 3, 1);
        fire("pointerup", 96, 36, 0);
      }
    }

    // `?wheel=1` synthesises one scroll notch, for the zoom handler.
    if (new URLSearchParams(location.search).has("wheel")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        canvas.dispatchEvent(
          new WheelEvent("wheel", {
            deltaY: 240,
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + rect.height / 2,
            bubbles: true,
            cancelable: true,
          }),
        );
      }
    }

    // `?dblclick=1` drags and then double-clicks: the second down must carry a
    // click count of 2, which recentres the camera on the demo pose.
    if (new URLSearchParams(location.search).has("dblclick")) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const canvas = document.querySelector("canvas");
      if (canvas) {
        const rect = canvas.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const fire = (type, cx, cy, buttons) =>
          canvas.dispatchEvent(
            new PointerEvent(type, {
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true,
              clientX: cx,
              clientY: cy,
              buttons,
              bubbles: true,
              cancelable: true,
            }),
          );
        // A drag first, so the recentre is visible.
        fire("pointerdown", x, y, 1);
        for (let i = 1; i <= 12; i += 1) fire("pointermove", x + i * 8, y + i * 3, 1);
        fire("pointerup", x + 96, y + 36, 0);
        // Then two clicks in quick succession at one spot.
        for (let i = 0; i < 2; i += 1) {
          fire("pointerdown", x, y, 1);
          fire("pointerup", x, y, 0);
        }
      }
    }
  </script>
</body>
</html>
