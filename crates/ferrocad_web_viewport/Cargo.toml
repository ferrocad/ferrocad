# The browser (wasm32) viewport: a canvas surface, the wgpu device, the render call
# and pointer/wheel navigation.
#
# The wasm analogue of `ferrocad_viewport`, which is bound to GPUI. Like the
# renderer it sits on, it owns no scene and no demo: a host supplies a `Camera`
# pose and the draw packets.
[package]
name = "ferrocad_web_viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Browser (wasm32) viewport for FerroCAD: canvas surface, wgpu device, orbit/zoom input"
keywords = ["cad", "wgpu", "wasm", "viewport"]
categories = ["gui", "wasm"]
documentation = "https://docs.rs/ferrocad_web_viewport"
# Like `ferrocad_web`: a surface the workspace ships examples on, not a crates.io
# crate.
publish = false

[lib]
name = "ferrocad_web_viewport"

[dependencies]
# The draw contract (`Camera`, `DrawPacket`, `Viewport`).
ferrocad_graphics.workspace = true
# The renderer (surface-free by design; this crate supplies the surface).
ferrocad_wgpu.workspace = true
# WebGPU in the browser; `webgl` enables the GL/WebGL2 fallback, which is the
# path that must work on Linux.
wgpu = { version = "29", features = ["webgl"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "PointerEvent",
    "WheelEvent",
    "Window",
    "console",
] }
