[package]
name = "ferrocad_wgpu"
version = "0.1.4"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD's wgpu backend: hardware commands, WGSL pipelines, dynamic uniforms and g-buffer picking"
keywords = ["cad", "freecad", "wgpu", "renderer"]
categories = ["graphics", "rendering"]
documentation = "https://docs.rs/ferrocad_wgpu"

[lib]
name = "ferrocad_wgpu"

[dependencies]
# The neutral draw contract it consumes (DrawPacket/Geometry/Camera/Rect/…).
ferrocad_graphics.workspace = true
# The presentation seam (`InventorView`/`ViewSpec`/`ImageData`) still lives with the
# inventor core.
ferrocad_inventor.workspace = true
ferrocad_types.workspace = true
# The declarative producer the documentation snapshot spec builds its scene with
# (`Stage`/`ShapeItem`/`DrawMode`). Pure data: no kernel, no Python, no GPU.
ferrocad_stage.workspace = true
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
# A documentation snapshot is a JSON spec; the renderer itself never parses one.
serde.workspace = true
# PNG encoding for the snapshot path: `image` is already in the workspace tree
# through the viewport and gpui, so this adds no new download.
image = "0.25"

[dev-dependencies]
# The snapshot tests build a spec from JSON, as the example binary does.
serde_json.workspace = true
# CPU validation of the authored WGSL (`grid_overlay.wgsl`): parse + validate + binding
# layout, without a GPU. Dev-only: naga is already in the tree through wgpu.
naga = { version = "29", features = ["wgsl-in"] }
