[package]
name = "ferrocad_wgpu"
version = "0.1.3"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "FerroCAD's wgpu backend: hardware commands, WGSL pipelines, dynamic uniforms and g-buffer picking"
keywords = ["cad", "freecad", "wgpu", "renderer"]
categories = ["graphics", "rendering"]
documentation = "https://docs.rs/ferrocad_wgpu"

[lib]
name = "ferrocad_wgpu"

[dependencies]
# The neutral draw contract it consumes (DrawPacket/Geometry/Camera/Rect/…).
ferrocad_graphics.workspace = true
# The presentation seam (`InventorView`/`ViewSpec`/`ImageData`) still lives with the
# inventor core.
ferrocad_inventor.workspace = true
ferrocad_types.workspace = true
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# The coexistence test proves the renderer draws a modern `ferrocad_stage` producer and
# a legacy inventor producer in one pass with a shared upload cache. Dev-only: the
# renderer itself has no knowledge of either producer's crate.
ferrocad_stage.workspace = true
# CPU validation of the authored WGSL (`grid_overlay.wgsl`): parse + validate + binding
# layout, without a GPU. Dev-only: naga is already in the tree through wgpu.
naga = { version = "29", features = ["wgsl-in"] }
