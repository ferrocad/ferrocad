[package]
name = "ferrocad_widgets"
version = "0.1.4"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Reusable bite-gpui widgets for FerroCAD: window chrome, editable field, console text area"
keywords = ["cad", "gui", "widgets", "gpui"]
categories = ["gui"]
documentation = "https://docs.rs/ferrocad_widgets"

[lib]
name = "ferrocad_widgets"

[dependencies]
# A wasm-safe clock: `std::time::Instant::now()` panics on `wasm32-unknown-unknown`.
web-time = "1"
bite-gpui = { version = "=1.25.203" }
unicode-segmentation.workspace = true
# The shared packed-sRGB tokens: widgets must not import the shell's copy.
ferrocad_theme.workspace = true

[dev-dependencies]
# Enables TestAppContext / #[gpui::test] for the headless component tests.
bite-gpui = { version = "=1.25.203", features = ["test-support"] }
