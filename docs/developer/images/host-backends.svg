<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 848" width="1100" height="848" role="img" aria-labelledby="title desc">
  <title id="title">FerroCAD system architecture: hosts, the seam, one document half, four runtimes and the engine</title>
  <desc id="desc">Four layers: the platform hosts that own the entry point, window and FilePicker (native desktop, browser wasm); the platform-neutral seam (ferrocad_shell_core over ferrocad_shell_api's AppBackend document half and optional ScriptHost scripting half); one RustAppBackend document half that every runtime instantiates, holding one of four scripting configurations (CPython's PythonScriptHost, RustPython's PywasmScriptHost, the JS JsScriptHost, or none), chosen in the browser by ferrocad_shell_web from the page's query string; and the shared ferrocad_core plus ferrocad_part engine over OCCT, which the JS half and wasm addons reach through ferrocad_doc_api's JSON doorway rather than by linking the engine.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794" />
    </marker>
    <linearGradient id="shared-scripts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cfa6" />
      <stop offset="0.5" stop-color="#e6d5b8" />
      <stop offset="1" stop-color="#b9dcc2" />
    </linearGradient>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-size: 13px; fill: #4a5568; }
      .band { stroke-width: 1.5; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; fill: #4a5568; }
      .box-title { font-size: 13px; font-weight: 600; fill: #1a202c; }
      .box-sub { font-size: 11px; fill: #4a5568; }
      .note { font-size: 11px; fill: #4a5568; }
      .note-italic { font-size: 11px; font-style: italic; fill: #4a5568; }
      .wire { stroke: #4a5568; stroke-width: 1.6; fill: none; }
      .dash { stroke: #7b8794; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="848" fill="#f7f9fc" />

  <text class="t title" x="550" y="32" text-anchor="middle">FERROCAD SYSTEM ARCHITECTURE</text>
  <text class="t subtitle" x="550" y="54" text-anchor="middle">Hosts own the window &amp; FilePicker · one document half · the runtime names the script half · one engine</text>

  <!-- ============ layer 1: hosts ============ -->
  <rect class="band" x="76" y="74" width="1000" height="84" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,116) rotate(-90)" text-anchor="middle">1. HOSTS</text>

  <rect class="box" x="92" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="292" y="105" text-anchor="middle">NATIVE DESKTOP HOST</text>
  <text class="t box-sub" x="292" y="122" text-anchor="middle">crates/ferrocad · ferrocad_parametric · ferrocad_toy (bin)</text>
  <text class="t box-sub" x="292" y="138" text-anchor="middle">run_with(HostConfig) · --script-host= · NativeFilePicker</text>

  <rect class="box" x="608" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="808" y="105" text-anchor="middle">BROWSER WASM HOST</text>
  <text class="t box-sub" x="808" y="122" text-anchor="middle">ferrocad_web_gpui (cdylib)</text>
  <text class="t box-sub" x="808" y="138" text-anchor="middle">wasm entry · WebFilePicker · ?runtime=plain|pywasm|js</text>

  <line class="wire" x1="292" y1="148" x2="292" y2="184" marker-end="url(#arrow)" />
  <line class="wire" x1="808" y1="148" x2="808" y2="184" marker-end="url(#arrow)" />
  <text class="t note-italic" x="302" y="170" text-anchor="start">installs a RustAppBackend (+ a ScriptHost) and a FilePicker, then boots the shell</text>

  <!-- ============ layer 2: the seam ============ -->
  <rect class="band" x="76" y="186" width="1000" height="112" rx="10" fill="#dbe9f6" stroke="#8fb8d8" />
  <text class="t band-label" transform="translate(64,242) rotate(-90)" text-anchor="middle">2. THE SEAM</text>

  <rect class="box" x="330" y="194" width="440" height="36" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="209" text-anchor="middle">ferrocad_shell_core</text>
  <text class="t box-sub" x="550" y="223" text-anchor="middle">GPUI shell · chrome · panels · viewport · DisplaySync · FilePicker</text>

  <rect class="box" x="260" y="246" width="275" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="397" y="264" text-anchor="middle">AppBackend</text>
  <text class="t box-sub" x="397" y="279" text-anchor="middle">documents · objects · meshes · edits · undo</text>

  <rect class="box" x="555" y="246" width="285" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" stroke-dasharray="5 3" />
  <text class="t box-title" x="697" y="264" text-anchor="middle">ScriptHost (optional)</text>
  <text class="t box-sub" x="697" y="279" text-anchor="middle">commands · Settings · providers · dialogs · tools</text>

  <line class="dash" x1="430" y1="230" x2="430" y2="246" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="660" y1="230" x2="660" y2="246" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="668" y="242" text-anchor="start">script_host()</text>

  <!-- one implementation holds both halves, and every runtime is that one implementation -->
  <line class="dash" x1="397" y1="290" x2="397" y2="304" />
  <line class="dash" x1="697" y1="290" x2="697" y2="304" />
  <line class="dash" x1="397" y1="304" x2="697" y2="304" />
  <line class="dash" x1="570" y1="304" x2="570" y2="321" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="386" y="309" text-anchor="end">RustAppBackend implements the first and holds the second</text>

  <!-- ============ layer 3: one document half, four runtimes ============ -->
  <rect class="band" x="76" y="316" width="1000" height="276" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,454) rotate(-90)" text-anchor="middle">3. BACKENDS (BY RUNTIME)</text>

  <!-- the shared document half -->
  <rect class="box" x="92" y="322" width="956" height="44" rx="6" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t box-title" x="570" y="340" text-anchor="middle">RustAppBackend — the document half in every configuration</text>
  <text class="t box-sub" x="570" y="356" text-anchor="middle">ferrocad_shell_rust · the only AppBackend a host installs · the browser picks the script half with ferrocad_shell_web (?runtime=plain|pywasm|js)</text>

  <!-- fan-out to the four runtimes -->
  <line class="dash" x1="205" y1="366" x2="205" y2="376" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="449" y1="366" x2="449" y2="376" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="693" y1="366" x2="693" y2="376" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="937" y1="366" x2="937" y2="376" marker-end="url(#dash-arrow)" />

  <!-- column 1: CPython -->
  <rect class="box" x="92" y="376" width="226" height="60" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="394" text-anchor="middle">PythonScriptHost</text>
  <text class="t box-sub" x="205" y="410" text-anchor="middle">ferrocad_shell_python</text>
  <text class="t box-sub" x="205" y="426" text-anchor="middle">native · embedded CPython</text>
  <line class="wire" x1="205" y1="436" x2="205" y2="446" marker-end="url(#arrow)" />

  <rect class="box" x="92" y="446" width="226" height="44" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="464" text-anchor="middle">Embedded CPython VM</text>
  <text class="t box-sub" x="205" y="480" text-anchor="middle">python/FreeCAD + mods</text>
  <line class="wire" x1="205" y1="490" x2="205" y2="498" marker-end="url(#arrow)" />

  <!-- column 2: RustPython, installed by the browser behind ?pywasm=1 -->
  <rect class="box" x="336" y="376" width="226" height="60" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="394" text-anchor="middle">PywasmScriptHost</text>
  <text class="t box-sub" x="449" y="410" text-anchor="middle">ferrocad_shell_pywasm</text>
  <text class="t box-sub" x="449" y="426" text-anchor="middle">browser host · ?pywasm=1</text>
  <line class="wire" x1="449" y1="436" x2="449" y2="446" marker-end="url(#arrow)" />

  <rect class="box" x="336" y="446" width="226" height="44" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="464" text-anchor="middle">RustPython VM</text>
  <text class="t box-sub" x="449" y="480" text-anchor="middle">bootstrap.py (FreeCAD + stdlib)</text>
  <line class="wire" x1="449" y1="490" x2="449" y2="498" marker-end="url(#arrow)" />

  <!-- column 3: no runtime, no scripting half -->
  <rect class="box" x="580" y="376" width="226" height="60" rx="5" fill="#f0f2f5" stroke="#94a3b8" stroke-dasharray="5 3" />
  <text class="t box-title" x="693" y="394" text-anchor="middle">no ScriptHost</text>
  <text class="t box-sub" x="693" y="410" text-anchor="middle">ferrocad_shell_rust</text>
  <text class="t box-sub" x="693" y="426" text-anchor="middle">the document answers alone</text>
  <line class="wire" x1="693" y1="436" x2="693" y2="446" marker-end="url(#arrow)" />

  <rect class="box" x="580" y="446" width="226" height="44" rx="5" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t box-title" x="693" y="464" text-anchor="middle">direct Rust calls</text>
  <text class="t box-sub" x="693" y="480" text-anchor="middle">no interpreter, no bridge</text>

  <!-- column 4: JS -->
  <rect class="box" x="824" y="376" width="226" height="60" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="394" text-anchor="middle">JsScriptHost</text>
  <text class="t box-sub" x="937" y="410" text-anchor="middle">ferrocad_shell_js</text>
  <text class="t box-sub" x="937" y="426" text-anchor="middle">wasm · ES module + the DocApi doorway</text>
  <line class="wire" x1="937" y1="436" x2="937" y2="446" marker-end="url(#arrow)" />

  <rect class="box" x="824" y="446" width="226" height="44" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="464" text-anchor="middle">window.__ferrocadJs</text>
  <text class="t box-sub" x="937" y="480" text-anchor="middle">ES module (www/js-demo.js)</text>

  <!-- the one Python script both VMs run -->
  <rect class="box" x="92" y="498" width="470" height="36" rx="6" fill="url(#shared-scripts)" stroke="#8a9bb0" />
  <text class="t box-title" x="327" y="515" text-anchor="middle">python/ferrocad_shell + catalog.json (shared Python script)</text>
  <text class="t box-sub" x="327" y="529" text-anchor="middle">runs unchanged in both VMs; calls the VM's native module below</text>

  <!-- native bridges: one per VM, and they are not the same module -->
  <line class="wire" x1="205" y1="534" x2="205" y2="542" marker-end="url(#arrow)" />
  <rect class="box" x="92" y="542" width="226" height="44" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="560" text-anchor="middle">ferrocad_py / ferrocad_part_py</text>
  <text class="t box-sub" x="205" y="576" text-anchor="middle">PyO3 C-ABI extension (native only)</text>

  <line class="wire" x1="449" y1="534" x2="449" y2="542" marker-end="url(#arrow)" />
  <rect class="box" x="336" y="542" width="226" height="44" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="560" text-anchor="middle">_ferrocad (rustpython-vm)</text>
  <text class="t box-sub" x="449" y="576" text-anchor="middle">native Rust module (_ferrocad.document)</text>

  <!-- ============ layer 4: the engine ============ -->
  <rect class="band" x="76" y="606" width="1000" height="104" rx="10" fill="#cfdceb" stroke="#8fa9c6" />
  <text class="t band-label" transform="translate(64,658) rotate(-90)" text-anchor="middle">4. ENGINE</text>

  <rect class="box" x="370" y="616" width="360" height="54" rx="6" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="637" text-anchor="middle">ferrocad_core · ferrocad_part</text>
  <text class="t box-sub" x="550" y="653" text-anchor="middle">(pure Rust + OCCT · present · drawable · Quantity)</text>

  <text class="t note" x="550" y="690" text-anchor="middle">drawable / effective_color / origin / present live in ferrocad_core · OCCT: system library natively, prebuilt wasm kernel in the browser</text>

  <path class="wire" d="M 205 586 L 205 600 L 410 616" marker-end="url(#arrow)" />
  <text class="t note" x="213" y="598" text-anchor="start">calls</text>
  <path class="wire" d="M 449 586 L 449 600 L 500 616" marker-end="url(#arrow)" />
  <text class="t note" x="457" y="598" text-anchor="start">calls (present + snapshot)</text>
  <path class="wire" d="M 693 490 L 693 616" marker-end="url(#arrow)" />
  <text class="t note" x="701" y="560" text-anchor="start">used directly</text>

  <!-- the JS half does not hold the document: it calls the host's doorway -->
  <path class="wire" d="M 937 490 L 937 640 L 734 640" marker-end="url(#arrow)" />
  <text class="t note" x="945" y="656" text-anchor="end">window.ferrocad.call → ferrocad_doc_api</text>

  <!-- legend -->
  <rect x="76" y="718" width="16" height="12" rx="2" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t note" x="99" y="728" text-anchor="start">CPython + PyO3 (native only)</text>
  <rect x="280" y="718" width="16" height="12" rx="2" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t note" x="303" y="728" text-anchor="start">RustPython + _ferrocad (wasm + native)</text>
  <rect x="520" y="718" width="16" height="12" rx="2" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t note" x="543" y="728" text-anchor="start">RustAppBackend (shared document half)</text>
  <rect x="770" y="718" width="16" height="12" rx="2" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t note" x="793" y="728" text-anchor="start">the shared CAD engine</text>

  <text class="t note-italic" x="76" y="752" text-anchor="start">AppBackend is the document half; ScriptHost is optional. All four configurations are the same RustAppBackend with a different (or no) script half.</text>
  <text class="t note-italic" x="76" y="770" text-anchor="start">Both Python script halves reach ferrocad_core through their VM's native module: CPython via ferrocad_py (PyO3), RustPython via _ferrocad.</text>
  <text class="t note-italic" x="76" y="788" text-anchor="start">The browser host installs one of the three wasm configurations through ferrocad_shell_web: ?runtime=plain|pywasm|js (?js=1 and ?pywasm=1 are the short forms).</text>
  <text class="t note-italic" x="76" y="806" text-anchor="start">A wasm addon (ferrocad_addon_toy → www/addons/toy.wasm) shares that doorway: a second ferrocad_core would be a second document, so it calls the host's one.</text>
  <text class="t note-italic" x="76" y="824" text-anchor="start">Which half runs which verb is backend-ownership.svg: the catalogue is one metadata source and catalog::executor names the executor of each id.</text>
</svg>
