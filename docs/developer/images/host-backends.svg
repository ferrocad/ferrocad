<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-labelledby="title desc">
  <title id="title">FerroCAD system architecture: hosts, the seam, backends and the engine</title>
  <desc id="desc">Four layers: the platform hosts that own the entry point, window and FilePicker (native desktop, browser wasm); the platform-neutral seam (ferrocad_shell_core over ferrocad_shell_api's AppBackend document half and optional ScriptHost scripting half); one RustAppBackend — the single AppBackend — composed with one ScriptHost per runtime (PythonScriptHost for embedded CPython, PywasmScriptHost for RustPython, JsScriptHost for an ES module, or none for pure Rust), each runtime reaching the engine through its own native module; and the shared ferrocad_core plus ferrocad_part engine over OCCT.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794" />
    </marker>
    <linearGradient id="shared-scripts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cfa6" />
      <stop offset="0.5" stop-color="#e6d5b8" />
      <stop offset="1" stop-color="#b9dcc2" />
    </linearGradient>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-size: 13px; fill: #4a5568; }
      .band { stroke-width: 1.5; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; fill: #4a5568; }
      .col-head { font-size: 12px; font-weight: 700; fill: #1a202c; }
      .box-title { font-size: 13px; font-weight: 600; fill: #1a202c; }
      .box-sub { font-size: 11px; fill: #4a5568; }
      .note { font-size: 11px; fill: #4a5568; }
      .note-italic { font-size: 11px; font-style: italic; fill: #4a5568; }
      .wire { stroke: #4a5568; stroke-width: 1.6; fill: none; }
      .dash { stroke: #7b8794; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#f7f9fc" />

  <text class="t title" x="550" y="32" text-anchor="middle">FERROCAD SYSTEM ARCHITECTURE</text>
  <text class="t subtitle" x="550" y="54" text-anchor="middle">Hosts own the window &amp; FilePicker · one AppBackend, one scripting half per runtime · one seam and one engine</text>

  <!-- ============ layer 1: hosts ============ -->
  <rect class="band" x="76" y="74" width="1000" height="84" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,116) rotate(-90)" text-anchor="middle">1. HOSTS</text>

  <rect class="box" x="92" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="292" y="105" text-anchor="middle">NATIVE DESKTOP HOST</text>
  <text class="t box-sub" x="292" y="122" text-anchor="middle">crates/ferrocad · ferrocad_parametric · ferrocad_toy (bin)</text>
  <text class="t box-sub" x="292" y="138" text-anchor="middle">ferrocad_shell_python::run_with · NativeFilePicker (portal)</text>

  <rect class="box" x="608" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="808" y="105" text-anchor="middle">BROWSER WASM HOST</text>
  <text class="t box-sub" x="808" y="122" text-anchor="middle">ferrocad_web_gpui (cdylib)</text>
  <text class="t box-sub" x="808" y="138" text-anchor="middle">wasm entry · WebFilePicker (&lt;input&gt; / download) · ?js=1</text>

  <line class="wire" x1="292" y1="148" x2="292" y2="184" marker-end="url(#arrow)" />
  <line class="wire" x1="808" y1="148" x2="808" y2="184" marker-end="url(#arrow)" />
  <text class="t note-italic" x="302" y="170" text-anchor="start">installs a backend + FilePicker, then boots the shell</text>

  <!-- ============ layer 2: the seam ============ -->
  <rect class="band" x="76" y="186" width="1000" height="112" rx="10" fill="#dbe9f6" stroke="#8fb8d8" />
  <text class="t band-label" transform="translate(64,242) rotate(-90)" text-anchor="middle">2. THE SEAM</text>

  <rect class="box" x="330" y="194" width="440" height="36" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="209" text-anchor="middle">ferrocad_shell_core</text>
  <text class="t box-sub" x="550" y="223" text-anchor="middle">GPUI shell · chrome · panels · viewport · DisplaySync · FilePicker</text>

  <rect class="box" x="260" y="246" width="275" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="397" y="264" text-anchor="middle">AppBackend</text>
  <text class="t box-sub" x="397" y="279" text-anchor="middle">document half + catalog (ferrocad_shell_api)</text>

  <rect class="box" x="555" y="246" width="285" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" stroke-dasharray="5 3" />
  <text class="t box-title" x="697" y="264" text-anchor="middle">ScriptHost (optional)</text>
  <text class="t box-sub" x="697" y="279" text-anchor="middle">evaluate · commands · tool · inventor_scene · events</text>

  <line class="dash" x1="430" y1="230" x2="430" y2="246" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="660" y1="230" x2="660" y2="246" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="668" y="242" text-anchor="start">script_host()</text>

  <!-- implemented-by bus -->
  <line class="dash" x1="397" y1="290" x2="397" y2="306" />
  <line class="dash" x1="697" y1="290" x2="697" y2="306" />
  <line class="dash" x1="205" y1="306" x2="937" y2="306" />
  <line class="dash" x1="205" y1="306" x2="205" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="449" y1="306" x2="449" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="693" y1="306" x2="693" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="937" y1="306" x2="937" y2="322" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="300" y="302" text-anchor="middle">implemented / composed by</text>

  <!-- ============ layer 3: backends ============ -->
  <rect class="band" x="76" y="316" width="1000" height="278" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,455) rotate(-90)" text-anchor="middle">3. BACKEND + SCRIPT HOSTS</text>

  <!-- the four runtimes, as columns -->
  <text class="t col-head" x="205" y="334" text-anchor="middle">PYTHON (CPython)</text>
  <text class="t box-sub" x="205" y="348" text-anchor="middle">ferrocad_shell_python</text>
  <text class="t col-head" x="449" y="334" text-anchor="middle">WASM PYTHON</text>
  <text class="t box-sub" x="449" y="348" text-anchor="middle">ferrocad_shell_pywasm</text>
  <text class="t col-head" x="693" y="334" text-anchor="middle">RUST (no runtime)</text>
  <text class="t box-sub" x="693" y="348" text-anchor="middle">no ScriptHost</text>
  <text class="t col-head" x="937" y="334" text-anchor="middle">JS / WASM</text>
  <text class="t box-sub" x="937" y="348" text-anchor="middle">ferrocad_shell_js</text>

  <!-- ONE AppBackend, over the runtimes it composes -->
  <rect class="box" x="92" y="356" width="954" height="46" rx="6" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t box-title" x="569" y="374" text-anchor="middle">RustAppBackend — the one AppBackend (ferrocad_shell_rust)</text>
  <text class="t box-sub" x="569" y="390" text-anchor="middle">document half + catalog · formed as with_script_host(one of the hosts below) · reads ferrocad_core directly</text>

  <line class="wire" x1="205" y1="402" x2="205" y2="410" marker-end="url(#arrow)" />
  <line class="wire" x1="449" y1="402" x2="449" y2="410" marker-end="url(#arrow)" />
  <line class="wire" x1="937" y1="402" x2="937" y2="410" marker-end="url(#arrow)" />

  <!-- ScriptHost implementations: the pluggable half -->
  <rect class="box" x="104" y="412" width="202" height="36" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="428" text-anchor="middle">PythonScriptHost</text>
  <text class="t box-sub" x="205" y="442" text-anchor="middle">native CPython</text>

  <rect class="box" x="348" y="412" width="202" height="36" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="428" text-anchor="middle">PywasmScriptHost</text>
  <text class="t box-sub" x="449" y="442" text-anchor="middle">RustPython · not installed yet</text>

  <rect class="box" x="836" y="412" width="202" height="36" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="428" text-anchor="middle">JsScriptHost</text>
  <text class="t box-sub" x="937" y="442" text-anchor="middle">ES module (?js=1)</text>

  <!-- the Rust column has no scripting half; the backend runs alone -->
  <line class="wire" x1="693" y1="402" x2="693" y2="610" marker-end="url(#arrow)" />
  <text class="t note" x="701" y="428" text-anchor="start">script_host = None</text>
  <text class="t note" x="701" y="466" text-anchor="start">no runtime: the</text>
  <text class="t note" x="701" y="480" text-anchor="start">document half alone</text>
  <text class="t note" x="701" y="560" text-anchor="start">used directly</text>

  <!-- VM / runtime row -->
  <line class="wire" x1="205" y1="448" x2="205" y2="456" marker-end="url(#arrow)" />
  <rect class="box" x="104" y="456" width="202" height="36" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="472" text-anchor="middle">Embedded CPython VM</text>
  <text class="t box-sub" x="205" y="486" text-anchor="middle">python/FreeCAD + mods</text>

  <line class="wire" x1="449" y1="448" x2="449" y2="456" marker-end="url(#arrow)" />
  <rect class="box" x="348" y="456" width="202" height="36" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="472" text-anchor="middle">RustPython VM</text>
  <text class="t box-sub" x="449" y="486" text-anchor="middle">bootstrap.py (FreeCAD + stdlib)</text>

  <line class="wire" x1="937" y1="448" x2="937" y2="456" marker-end="url(#arrow)" />
  <rect class="box" x="836" y="456" width="202" height="40" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="474" text-anchor="middle">window.__ferrocadJs</text>
  <text class="t box-sub" x="937" y="489" text-anchor="middle">ES module (www/js-demo.js)</text>

  <!-- the shared Python script, spanning both Python columns -->
  <line class="wire" x1="205" y1="492" x2="205" y2="500" marker-end="url(#arrow)" />
  <line class="wire" x1="449" y1="492" x2="449" y2="500" marker-end="url(#arrow)" />
  <rect class="box" x="92" y="500" width="470" height="34" rx="6" fill="url(#shared-scripts)" stroke="#8a9bb0" />
  <text class="t box-title" x="327" y="515" text-anchor="middle">python/ferrocad_shell + catalog.json (shared Python script)</text>
  <text class="t box-sub" x="327" y="528" text-anchor="middle">runs unchanged in both VMs; calls into the VM's native Rust module below</text>

  <!-- native modules: what the script calls -->
  <line class="wire" x1="205" y1="534" x2="205" y2="542" marker-end="url(#arrow)" />
  <rect class="box" x="92" y="542" width="226" height="40" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="559" text-anchor="middle">ferrocad_py / ferrocad_part_py</text>
  <text class="t box-sub" x="205" y="573" text-anchor="middle">PyO3 C-ABI extension (native only)</text>

  <line class="wire" x1="449" y1="534" x2="449" y2="542" marker-end="url(#arrow)" />
  <rect class="box" x="336" y="542" width="226" height="40" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="559" text-anchor="middle">_ferrocad (rustpython-vm)</text>
  <text class="t box-sub" x="449" y="573" text-anchor="middle">native Rust module (_ferrocad.document)</text>

  <!-- ============ layer 4: the engine ============ -->
  <rect class="band" x="76" y="602" width="1000" height="104" rx="10" fill="#cfdceb" stroke="#8fa9c6" />
  <text class="t band-label" transform="translate(64,654) rotate(-90)" text-anchor="middle">4. ENGINE</text>

  <rect class="box" x="370" y="612" width="360" height="54" rx="6" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="633" text-anchor="middle">ferrocad_core · ferrocad_part</text>
  <text class="t box-sub" x="550" y="649" text-anchor="middle">(pure Rust + OCCT · present · drawable · Quantity)</text>

  <text class="t note" x="550" y="686" text-anchor="middle">drawable / effective_color / origin / present live in ferrocad_core · OCCT: system library natively, prebuilt wasm kernel in the browser</text>

  <!-- PyO3 bindings -> engine -->
  <path class="wire" d="M 205 582 L 205 596 L 410 612" marker-end="url(#arrow)" />
  <text class="t note" x="213" y="594" text-anchor="start">calls</text>
  <!-- RustPython _ferrocad native module -> engine -->
  <path class="wire" d="M 449 582 L 449 596 L 500 612" marker-end="url(#arrow)" />
  <text class="t note" x="457" y="594" text-anchor="start">calls (present + snapshot)</text>

  <!-- legend -->
  <rect x="76" y="714" width="16" height="12" rx="2" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t note" x="99" y="724" text-anchor="start">CPython + PyO3 (native only)</text>
  <rect x="280" y="714" width="16" height="12" rx="2" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t note" x="303" y="724" text-anchor="start">RustPython + _ferrocad (wasm + native)</text>
  <rect x="520" y="714" width="16" height="12" rx="2" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t note" x="543" y="724" text-anchor="start">RustAppBackend (shared document half)</text>
  <rect x="770" y="714" width="16" height="12" rx="2" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t note" x="793" y="724" text-anchor="start">the shared CAD engine</text>

  <text class="t note-italic" x="76" y="748" text-anchor="start">One AppBackend, one scripting half: RustAppBackend is formed with PythonScriptHost / PywasmScriptHost / JsScriptHost, or with none (the Rust column).</text>
  <text class="t note-italic" x="76" y="766" text-anchor="start">Both Python halves reach ferrocad_core through their VM's native module: CPython via ferrocad_py (PyO3), RustPython via _ferrocad.</text>
  <text class="t note-italic" x="76" y="784" text-anchor="start">The JS half runs behind ?js=1; the wasm-Python half is not installed by any host yet. PythonAppBackend survives only for unlinked tests, and implements both halves.</text>
</svg>
