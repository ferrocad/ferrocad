<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-labelledby="title desc">
  <title id="title">FerroCAD system architecture: hosts, the seam, backends and the engine</title>
  <desc id="desc">Four layers: the platform hosts that own the entry point, window and FilePicker (native desktop, browser wasm); the platform-neutral seam (ferrocad_shell_core over ferrocad_shell_api's AppBackend document half and optional ScriptHost scripting half); the pluggable backends named by runtime (CPython in ferrocad_shell_python, pure-Rust RustAppBackend in ferrocad_shell_rust, and the two ScriptHost compositions ferrocad_shell_pywasm and ferrocad_shell_js); and the shared ferrocad_core plus ferrocad_part engine over OCCT.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794" />
    </marker>
    <linearGradient id="shared-scripts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cfa6" />
      <stop offset="0.5" stop-color="#e6d5b8" />
      <stop offset="1" stop-color="#b9dcc2" />
    </linearGradient>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-size: 13px; fill: #4a5568; }
      .band { stroke-width: 1.5; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; fill: #4a5568; }
      .col-head { font-size: 12px; font-weight: 700; fill: #1a202c; }
      .box-title { font-size: 13px; font-weight: 600; fill: #1a202c; }
      .box-sub { font-size: 11px; fill: #4a5568; }
      .note { font-size: 11px; fill: #4a5568; }
      .note-italic { font-size: 11px; font-style: italic; fill: #4a5568; }
      .wire { stroke: #4a5568; stroke-width: 1.6; fill: none; }
      .dash { stroke: #7b8794; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#f7f9fc" />

  <text class="t title" x="550" y="32" text-anchor="middle">FERROCAD SYSTEM ARCHITECTURE</text>
  <text class="t subtitle" x="550" y="54" text-anchor="middle">Hosts own the window &amp; FilePicker · backends are named by runtime · one seam and one engine</text>

  <!-- ============ layer 1: hosts ============ -->
  <rect class="band" x="76" y="74" width="1000" height="84" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,116) rotate(-90)" text-anchor="middle">1. HOSTS</text>

  <rect class="box" x="92" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="292" y="105" text-anchor="middle">NATIVE DESKTOP HOST</text>
  <text class="t box-sub" x="292" y="122" text-anchor="middle">crates/ferrocad · ferrocad_parametric · ferrocad_toy (bin)</text>
  <text class="t box-sub" x="292" y="138" text-anchor="middle">ferrocad_shell_python::run_with · NativeFilePicker (portal)</text>

  <rect class="box" x="608" y="84" width="400" height="64" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="t box-title" x="808" y="105" text-anchor="middle">BROWSER WASM HOST</text>
  <text class="t box-sub" x="808" y="122" text-anchor="middle">ferrocad_web_gpui (cdylib)</text>
  <text class="t box-sub" x="808" y="138" text-anchor="middle">wasm entry · WebFilePicker (&lt;input&gt; / download) · ?js=1</text>

  <line class="wire" x1="292" y1="148" x2="292" y2="184" marker-end="url(#arrow)" />
  <line class="wire" x1="808" y1="148" x2="808" y2="184" marker-end="url(#arrow)" />
  <text class="t note-italic" x="302" y="170" text-anchor="start">installs a backend + FilePicker, then boots the shell</text>

  <!-- ============ layer 2: the seam ============ -->
  <rect class="band" x="76" y="186" width="1000" height="112" rx="10" fill="#dbe9f6" stroke="#8fb8d8" />
  <text class="t band-label" transform="translate(64,242) rotate(-90)" text-anchor="middle">2. THE SEAM</text>

  <rect class="box" x="330" y="194" width="440" height="36" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="209" text-anchor="middle">ferrocad_shell_core</text>
  <text class="t box-sub" x="550" y="223" text-anchor="middle">GPUI shell · chrome · panels · viewport · DisplaySync · FilePicker</text>

  <rect class="box" x="260" y="246" width="275" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" />
  <text class="t box-title" x="397" y="264" text-anchor="middle">AppBackend</text>
  <text class="t box-sub" x="397" y="279" text-anchor="middle">document half + catalog (ferrocad_shell_api)</text>

  <rect class="box" x="555" y="246" width="285" height="44" rx="6" fill="#c6d9ee" stroke="#7d9ec4" stroke-dasharray="5 3" />
  <text class="t box-title" x="697" y="264" text-anchor="middle">ScriptHost (optional)</text>
  <text class="t box-sub" x="697" y="279" text-anchor="middle">evaluate · commands · tool · inventor_scene · events</text>

  <line class="dash" x1="430" y1="230" x2="430" y2="246" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="660" y1="230" x2="660" y2="246" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="668" y="242" text-anchor="start">script_host()</text>

  <!-- implemented-by bus -->
  <line class="dash" x1="397" y1="290" x2="397" y2="306" />
  <line class="dash" x1="697" y1="290" x2="697" y2="306" />
  <line class="dash" x1="205" y1="306" x2="937" y2="306" />
  <line class="dash" x1="205" y1="306" x2="205" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="449" y1="306" x2="449" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="693" y1="306" x2="693" y2="322" marker-end="url(#dash-arrow)" />
  <line class="dash" x1="937" y1="306" x2="937" y2="322" marker-end="url(#dash-arrow)" />
  <text class="t note-italic" x="300" y="302" text-anchor="middle">implemented / composed by</text>

  <!-- ============ layer 3: backends ============ -->
  <rect class="band" x="76" y="316" width="1000" height="270" rx="10" fill="#eef2f8" stroke="#b6c2d2" />
  <text class="t band-label" transform="translate(64,451) rotate(-90)" text-anchor="middle">3. BACKENDS (BY RUNTIME)</text>

  <!-- embedded CPython -->
  <rect class="box" x="92" y="324" width="226" height="38" rx="5" fill="#f3d3ac" stroke="#cf9a55" />
  <text class="t col-head" x="205" y="339" text-anchor="middle">PYTHON (CPython)</text>
  <text class="t box-sub" x="205" y="354" text-anchor="middle">ferrocad_shell_python</text>
  <rect class="box" x="104" y="370" width="202" height="40" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="387" text-anchor="middle">RustAppBackend</text>
  <text class="t note-italic" x="205" y="402" text-anchor="middle">+ PythonScriptHost</text>
  <line class="wire" x1="205" y1="410" x2="205" y2="424" marker-end="url(#arrow)" />
  <rect class="box" x="104" y="424" width="202" height="34" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="439" text-anchor="middle">Embedded CPython VM</text>
  <text class="t box-sub" x="205" y="452" text-anchor="middle">python/FreeCAD + mods</text>
  <line class="wire" x1="205" y1="458" x2="205" y2="472" marker-end="url(#arrow)" />

  <!-- wasm Python (RustPython) -->
  <rect class="box" x="336" y="324" width="226" height="38" rx="5" fill="#cfe6d6" stroke="#7fb391" />
  <text class="t col-head" x="449" y="339" text-anchor="middle">WASM PYTHON</text>
  <text class="t box-sub" x="449" y="354" text-anchor="middle">ferrocad_shell_pywasm</text>
  <rect class="box" x="348" y="370" width="202" height="40" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="387" text-anchor="middle">PywasmScriptHost</text>
  <text class="t note-italic" x="449" y="402" text-anchor="middle">plugged into RustAppBackend</text>
  <line class="wire" x1="449" y1="410" x2="449" y2="424" marker-end="url(#arrow)" />
  <rect class="box" x="348" y="424" width="202" height="34" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="439" text-anchor="middle">RustPython VM</text>
  <text class="t box-sub" x="449" y="452" text-anchor="middle">bootstrap.py (FreeCAD + stdlib)</text>
  <line class="wire" x1="449" y1="458" x2="449" y2="472" marker-end="url(#arrow)" />

  <!-- Shared python/ferrocad_shell source box spanning BOTH VMs -->
  <rect class="box" x="92" y="472" width="470" height="36" rx="6" fill="url(#shared-scripts)" stroke="#8a9bb0" />
  <text class="t box-title" x="327" y="488" text-anchor="middle">python/ferrocad_shell + catalog.json (shared Python script)</text>
  <text class="t box-sub" x="327" y="501" text-anchor="middle">runs unchanged in both VMs; calls into the VM's native Rust module below</text>

  <!-- Native-only PyO3 bindings (under CPython) -->
  <line class="wire" x1="205" y1="508" x2="205" y2="522" marker-end="url(#arrow)" />
  <rect class="box" x="92" y="522" width="226" height="48" rx="5" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t box-title" x="205" y="540" text-anchor="middle">ferrocad_py / ferrocad_part_py</text>
  <text class="t box-sub" x="205" y="554" text-anchor="middle">PyO3 C-ABI extension (native only)</text>

  <!-- RustPython native module (under RustPython) -->
  <line class="wire" x1="449" y1="508" x2="449" y2="522" marker-end="url(#arrow)" />
  <rect class="box" x="336" y="522" width="226" height="48" rx="5" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t box-title" x="449" y="540" text-anchor="middle">_ferrocad (rustpython-vm)</text>
  <text class="t box-sub" x="449" y="554" text-anchor="middle">native Rust module (_ferrocad.document)</text>

  <!-- Rust: no runtime -->
  <rect class="box" x="580" y="324" width="226" height="38" rx="5" fill="#e4c6e7" stroke="#b184b9" />
  <text class="t col-head" x="693" y="339" text-anchor="middle">RUST (no runtime)</text>
  <text class="t box-sub" x="693" y="354" text-anchor="middle">ferrocad_shell_rust</text>
  <rect class="box" x="592" y="370" width="202" height="78" rx="5" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t box-title" x="693" y="389" text-anchor="middle">RustAppBackend</text>
  <text class="t box-sub" x="693" y="405" text-anchor="middle">owns the Rust Document half</text>
  <text class="t box-sub" x="693" y="420" text-anchor="middle">with_script_host(opt)</text>
  <text class="t box-sub" x="693" y="435" text-anchor="middle">(default: script_host = None)</text>
  <text class="t note" x="701" y="466" text-anchor="start">shared document half for</text>
  <text class="t note" x="701" y="480" text-anchor="start">browser, Pywasm &amp; JS</text>

  <!-- JS modules -->
  <rect class="box" x="824" y="324" width="226" height="38" rx="5" fill="#d5dfea" stroke="#94a9c2" />
  <text class="t col-head" x="937" y="339" text-anchor="middle">JS / WASM</text>
  <text class="t box-sub" x="937" y="354" text-anchor="middle">ferrocad_shell_js</text>
  <rect class="box" x="836" y="370" width="202" height="40" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="387" text-anchor="middle">JsScriptHost</text>
  <text class="t note-italic" x="937" y="402" text-anchor="middle">plugged into RustAppBackend</text>
  <line class="wire" x1="937" y1="410" x2="937" y2="424" marker-end="url(#arrow)" />
  <rect class="box" x="836" y="424" width="202" height="52" rx="5" fill="#c9d5e3" stroke="#94a9c2" />
  <text class="t box-title" x="937" y="444" text-anchor="middle">window.__ferrocadJs</text>
  <text class="t box-sub" x="937" y="460" text-anchor="middle">ES module (www/js-demo.js)</text>

  <!-- composition arrows into RustAppBackend -->
  <path class="dash" d="M 550 390 L 592 390" marker-end="url(#dash-arrow)" />
  <path class="dash" d="M 836 390 L 794 390" marker-end="url(#dash-arrow)" />

  <!-- ============ layer 4: the engine ============ -->
  <rect class="band" x="76" y="602" width="1000" height="104" rx="10" fill="#cfdceb" stroke="#8fa9c6" />
  <text class="t band-label" transform="translate(64,654) rotate(-90)" text-anchor="middle">4. ENGINE</text>

  <rect class="box" x="370" y="612" width="360" height="54" rx="6" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t box-title" x="550" y="633" text-anchor="middle">ferrocad_core · ferrocad_part</text>
  <text class="t box-sub" x="550" y="649" text-anchor="middle">(pure Rust + OCCT · present · drawable · Quantity)</text>

  <text class="t note" x="550" y="686" text-anchor="middle">drawable / effective_color / origin / present live in ferrocad_core · OCCT: system library natively, prebuilt wasm kernel in the browser</text>

  <!-- PyO3 bindings -> engine -->
  <path class="wire" d="M 205 570 L 205 592 L 410 612" marker-end="url(#arrow)" />
  <text class="t note" x="213" y="588" text-anchor="start">calls</text>
  <!-- RustPython _ferrocad native module -> engine -->
  <path class="wire" d="M 449 570 L 449 592 L 500 612" marker-end="url(#arrow)" />
  <text class="t note" x="457" y="588" text-anchor="start">calls (present + snapshot)</text>
  <!-- Rust backend -> engine -->
  <path class="wire" d="M 693 448 L 693 612" marker-end="url(#arrow)" />
  <text class="t note" x="701" y="560" text-anchor="start">used directly</text>

  <!-- legend -->
  <rect x="76" y="714" width="16" height="12" rx="2" fill="#f6cfa6" stroke="#cf9a55" />
  <text class="t note" x="99" y="724" text-anchor="start">CPython + PyO3 (native only)</text>
  <rect x="280" y="714" width="16" height="12" rx="2" fill="#b9dcc2" stroke="#7fb391" />
  <text class="t note" x="303" y="724" text-anchor="start">RustPython + _ferrocad (wasm + native)</text>
  <rect x="520" y="714" width="16" height="12" rx="2" fill="#dcb8e2" stroke="#b184b9" />
  <text class="t note" x="543" y="724" text-anchor="start">RustAppBackend (shared document half)</text>
  <rect x="770" y="714" width="16" height="12" rx="2" fill="#b9cde4" stroke="#7d9ec4" />
  <text class="t note" x="793" y="724" text-anchor="start">the shared CAD engine</text>

  <text class="t note-italic" x="76" y="748" text-anchor="start">AppBackend is the document half; ScriptHost is optional. JsScriptHost and PywasmScriptHost plug into RustAppBackend::with_script_host.</text>
  <text class="t note-italic" x="76" y="766" text-anchor="start">Both Python backends reach ferrocad_core through their VM's native module: CPython via ferrocad_py (PyO3), RustPython via _ferrocad.</text>
  <text class="t note-italic" x="76" y="784" text-anchor="start">The JS half runs behind ?js=1 in the browser host; the wasm-Python half is not installed by any host yet.</text>
</svg>
