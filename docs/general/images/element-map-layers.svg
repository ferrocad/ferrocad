<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
<title id="title">FreeCAD's topological naming split</title>
<desc id="desc">The App layer stores and versions the element map; the Part layer consumes OCCT history and derives names; OCCT reports relationships, never names.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1040" height="600" fill="#f8fafc"/>
<rect x="60" y="40" width="600" height="130" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="78" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">App layer  (src/App)</text><text x="78" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Data::ComplexGeoData: base for shape payloads</text><text x="78" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Data::ElementMap: stable name -&gt; sub-shape</text><text x="78" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">getElementMapVersion(): versioned contract</text>
<line x1="360" y1="226" x2="360" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="375" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">names written into the map</text>
<line x1="120" y1="176" x2="120" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="134" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">resolve name → sub-shape</text>
<rect x="60" y="230" width="600" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="78" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">Part layer  (src/Mod/Part)</text><text x="78" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Part::TopoShape wraps OCCT's TopoDS_Shape</text><text x="78" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Part::TopoShapeMapper / TopoShapeExpansion.cpp</text><text x="78" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">derives names from the kernel's history</text>
<line x1="360" y1="426" x2="360" y2="376" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="375" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">raw history</text>
<line x1="120" y1="376" x2="120" y2="426" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="134" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">evaluate an operation</text>
<rect x="60" y="430" width="600" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="78" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">OCCT kernel</text><text x="78" y="482" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">BRepTools_History: Modified / Generated / Removed</text><text x="78" y="502" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">periodic faces carry a seam edge</text><text x="78" y="522" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">reports relationships only</text>
<text x="720" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Identity</text>
<text x="720" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">OCCT never reports a name;</text><text x="720" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">FreeCAD generates one from</text><text x="720" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the relationship graph.</text>
<text x="720" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Persistence</text>
<text x="720" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">PropertyPartShape saves the</text><text x="720" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">shape with its map and</text><text x="720" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">ElementMapVersion. A mismatch</text><text x="720" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">re-derives instead of trusting</text><text x="720" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">stale names.</text>
<text x="720" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Not portable</text>
<text x="720" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Names depend on kernel</text><text x="720" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">topology (seam edges) and</text><text x="720" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">FreeCAD's boolean wrappers.</text><text x="720" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">A different kernel would</text><text x="720" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">re-derive, not reuse them.</text>
</svg>
