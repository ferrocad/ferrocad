<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc">
<title id="title">The CAD data pipeline</title>
<desc id="desc">Analytic surfaces and NURBS are tessellated into a temporary mesh; a permanent mesh arrives from STL or OBJ; both feed the viewport scene graph and the GPU.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1040" height="880" fill="#f8fafc"/>
<text x="40" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">MATHEMATICAL DATA</text>
<text x="40" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">smooth · infinite · CPU-bound</text>
<text x="560" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">DISCRETE DATA</text>
<text x="560" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">faceted · rigid · baked</text>
<rect x="40" y="80" width="400" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">1. Mathematical geometry</text><text x="58" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">analytic surfaces + NURBS</text><text x="58" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">control points &amp; weights</text><text x="58" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">polynomial equations</text>
<line x1="240" y1="180" x2="240" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">forms the surfaces of</text>
<rect x="40" y="220" width="400" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">2. B-Rep data</text><text x="58" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">geometry: surfaces</text><text x="58" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">topology: faces, edges, wires</text><text x="58" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">tolerances seal the seams</text>
<line x1="240" y1="340" x2="240" y2="392" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">tessellated to</text>
<rect x="40" y="400" width="400" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">3. Temporary visual mesh</text><text x="58" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">discardable triangles</text><text x="58" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">regenerates whenever</text><text x="58" y="492" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">B-Rep dimensions change</text>
<rect x="560" y="400" width="400" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="578" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">4. Permanent mesh</text><text x="578" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">fixed triangle faces</text><text x="578" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">static vertex array</text><text x="578" y="492" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">imported from STL / OBJ</text>
<path d="M 240 520 L 240 550 L 520 550 L 520 576" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 760 520 L 760 550 L 520 550" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="520" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">both feed into</text>
<rect x="270" y="580" width="500" height="110" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="288" y="608" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">5. Viewport scene graph</text><text x="288" y="632" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Coin3D / Pivy</text><text x="288" y="652" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">ingests meshes only</text><text x="288" y="672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">SoIndexedFaceSet (mesh arrays)</text>
<line x1="520" y1="690" x2="520" y2="732" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="740" width="500" height="100" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="288" y="768" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">6. GPU hardware pipeline</text><text x="288" y="792" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">OpenGL / Vulkan</text><text x="288" y="812" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">vertex shader: 3D → screen</text><text x="288" y="832" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">fragment shader: lighting / color</text>
</svg>
