<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">The pluggable topological naming pattern</title>
<desc id="desc">Geometric drivers emit raw mutation events to an abstract broker, which routes to one of several naming strategies.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1000" height="660" fill="#f8fafc"/>
<rect x="80" y="40" width="840" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="98" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">1. The geometric drivers</text>
<rect x="110" y="82" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="230.0" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Part::TopoShape</text><text x="230.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">OCCT</text>
<rect x="380" y="82" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Mesh</text><text x="500.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">triangle data</text>
<rect x="650" y="82" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="770.0" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Other kernels</text><text x="770.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">...</text>
<line x1="500" y1="160" x2="500" y2="222" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">emits raw mutation events</text>
<text x="520" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="start">(input ids, op type, kernel history)</text>
<rect x="180" y="230" width="640" height="100" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">2. The abstract TNP broker (App core)</text><text x="198" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">ITopologicalNamingEngine — a proposed interface</text>
<line x1="500" y1="330" x2="500" y2="392" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">routes to the active strategy</text>
<rect x="80" y="400" width="840" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="98" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">3. Pluggable TNS implementations</text>
<rect x="110" y="460" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="128" y="488" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Genealogy hasher</text><text x="128" y="512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">upstream ElementMap</text><text x="128" y="530" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">idea</text>
<rect x="380" y="460" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="488" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Spatial heuristic</text><text x="398" y="512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">matcher</text>
<rect x="650" y="460" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="668" y="488" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Hybrid solver</text><text x="668" y="512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">solver</text>
</svg>
