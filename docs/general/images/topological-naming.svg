<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">The topological naming problem</title>
<desc id="desc">Two rows: a square extruded and filleted on edge 4; then a hexagon extruded, where positional numbering moves edge 4 to the bottom and the fillet lands on the wrong edge.</desc>
