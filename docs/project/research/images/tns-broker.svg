<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">A proposed broker for topological naming (research sketch)</title>
<desc id="desc">Geometric drivers would emit raw mutation events to an abstract broker, which would route to one of several naming strategies. No such interface exists in the workspace.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1000" height="680" fill="#f8fafc"/>
<text x="40" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#b45309" text-anchor="start">RESEARCH SKETCH — no such interface exists in the workspace</text>
<rect x="80" y="60" width="840" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="98" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">1. The geometric drivers</text>
<rect x="110" y="102" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="230.0" y="123" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Part::TopoShape</text><text x="230.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">OCCT</text>
<rect x="380" y="102" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="123" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Mesh</text><text x="500.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">triangle data</text>
<rect x="650" y="102" width="240" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="770.0" y="123" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Other kernels</text><text x="770.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">...</text>
<line x1="500" y1="180" x2="500" y2="242" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">emits raw mutation events</text>
<text x="520" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="start">(input ids, op type, kernel history)</text>
<rect x="180" y="250" width="640" height="100" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="198" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">2. The abstract TNP broker (App core)</text><text x="198" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">ITopologicalNamingEngine — a proposed interface</text>
<line x1="500" y1="350" x2="500" y2="412" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">routes to the active strategy</text>
<rect x="80" y="420" width="840" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="98" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">3. Pluggable TNS implementations</text>
<rect x="110" y="480" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="128" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Genealogy hasher</text><text x="128" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">upstream ElementMap</text><text x="128" y="550" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">idea</text>
<rect x="380" y="480" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Spatial heuristic</text><text x="398" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">matcher</text>
<rect x="650" y="480" width="240" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="668" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Hybrid solver</text><text x="668" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">solver</text>
</svg>
