[package]
name = "freecad-core"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust re-implementation of the headless FreeCAD document object model (POC)."
license = "LGPL-2.1-or-later"

[lib]
name = "freecad_core"
# A plain C ABI shared library loaded from Python via ctypes.
# Deliberately zero dependencies so it builds with no network and no Python headers.
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
