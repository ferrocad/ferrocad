[package]
name = "freecad-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings: the Rust FreeCAD core as a native Python extension"

[lib]
name = "freecad_py"
# A CPython extension module, importable as `FreeCAD._core`.
# `abi3` builds against the stable ABI so one binary works across CPython
# versions; it is also what lets us build for a CPython newer than the one
# PyO3 officially targets (see PYO3_USE_ABI3_FORWARD_COMPATIBILITY in build.sh).
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py38"] }
