# Throwaway spike: drive OCCT from Rust with the real binding crate and find out
# how much shape *history* the binding exposes.
#
# This is deliberately NOT a member of the FerroCAD workspace. The empty
# `[workspace]` table marks it as its own workspace root.
#
# Uses `opencascade-sys` (bschwind/opencascade-rs) directly, because the
# high-level `opencascade` `Shape` hides its `TopoDS_Shape` (pub(crate)) and so
# cannot reach the sub-shape traversal functions we need.
[package]
name = "occt-history-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
# Enable after applying patch/0001-history-bridge.patch to opencascade-sys.
patched = []

[dependencies]
opencascade-sys = "0.3"
cxx = "1"
