# A sibling cxx bridge over OCCT, reusing `opencascade-sys`'s types.
#
# This is the integration story made concrete: the missing history / element-map
# calls are added WITHOUT patching or forking `opencascade-sys`. A second
# `#[cxx::bridge]` declares the same OCCT types (`type X = opencascade_sys::...`)
# and links the same libraries.
#
# Requires OCCT_INCLUDE_DIR at build time (the OCCT `include/opencascade` dir).
[package]
name = "occt-history-bridge"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
opencascade-sys = "0.3"
cxx = "1"

[build-dependencies]
cxx-build = "1"
